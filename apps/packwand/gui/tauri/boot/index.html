<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Packwand</title>
	<style>
		body {
			margin: 0;
			display: grid;
			place-items: center;
			min-height: 100vh;
			background: #1b1b1f;
			color: #e0e0e6;
			font-family: system-ui, sans-serif;
		}
		main { display: grid; gap: 1rem; justify-items: center; padding: 2rem; }
		.actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
		button {
			border: 1px solid #555561;
			border-radius: 0.4rem;
			padding: 0.65rem 1rem;
			background: #2b2b32;
			color: inherit;
			cursor: pointer;
		}
		button:hover { background: #363640; }
		button:disabled { cursor: wait; opacity: 0.6; }
		.error { color: #ff6e6e; max-width: 40rem; white-space: pre-wrap; }
	</style>
</head>
<body>
	<main>
		<p id="status">Open Packwand using the detected repository or choose a workspace folder.</p>
		<div class="actions">
			<button id="detected" type="button">Use detected workspace</button>
			<button id="choose" type="button">Choose workspace…</button>
		</div>
	</main>
	<script>
		const invoke = window.__TAURI__.core.invoke;
		const status = document.getElementById("status");
		const buttons = [...document.querySelectorAll("button")];

		function setBusy(busy) {
			for (const button of buttons) button.disabled = busy;
		}

		async function start(workspace = null) {
			setBusy(true);
			status.className = "";
			status.textContent = "Starting Packwand…";
			try {
				const url = await invoke("backend_url", { workspace });
				window.location.replace(url);
			} catch (err) {
				setBusy(false);
				status.className = "error";
				status.textContent = "Failed to start the Packwand backend:\n" + err +
					"\n\nEnsure the selected folder is in a Packwand repository and the packwand binary is next to this app, on PATH, or set PACKWAND_BIN.";
			}
		}

		document.getElementById("detected").addEventListener("click", () => start());
		document.getElementById("choose").addEventListener("click", async () => {
			setBusy(true);
			try {
				const workspace = await invoke("select_workspace");
				if (workspace) await start(workspace);
				else setBusy(false);
			} catch (err) {
				setBusy(false);
				status.className = "error";
				status.textContent = "Could not open the workspace picker:\n" + err;
			}
		});
	</script>
</body>
</html>
