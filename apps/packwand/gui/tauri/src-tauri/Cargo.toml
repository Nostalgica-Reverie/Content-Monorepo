[package]
name = "packwand-gui"
version = "0.1.0"
description = "Native desktop shell for the Packwand GUI"
authors = ["Lasting Legacy"]
license = "AGPL-3.0-or-later"
repository = "https://git.nostalgica.net/Lasting-Legacy/Lasting-Legacy-Monorepo"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip.workspace = true
packwand-auth.workspace = true
packwand-instance.workspace = true
packwand-launch.workspace = true
packwand-devboot.workspace = true
packwand-msa.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
