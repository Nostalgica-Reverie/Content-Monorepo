[package]
name = "packwandc"
description = "Safe Rust SDK over the packwandc native core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
packwandc-sys = { path = "../packwandc-sys" }

[lints.rust]
# Mirrors the intent of the workspace lint table without inheriting it: the
# workspace set enables `clippy::cargo`, which demands publish metadata
# (keywords, categories, readme) from every package in the graph. That is
# meaningful for the vendored Packeater crates, which came from crates.io, and
# pure noise for internal `publish = false` crates like this one.
unsafe_code = "deny"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
private_intra_doc_links = "deny"
