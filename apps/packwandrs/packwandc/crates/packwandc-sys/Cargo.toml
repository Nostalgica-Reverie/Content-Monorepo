[package]
name = "packwandc-sys"
description = "Raw FFI bindings to the packwandc native core. The only crate in this repository permitted to use `unsafe`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Declares that this crate provides the native `packwandc` library, so cargo
# refuses to link two different versions of it into one binary.
links = "packwandc"

# No build-dependencies on purpose. CMake is authoritative for the C build
# (packwandc.md 6.3) and build.rs invokes it directly rather than through the
# `cmake` crate, which derives the compiler from `cc` and would override the
# Windows toolchain file with MSVC's cl.exe. Shelling out also keeps the
# native layer's zero-dependency rule intact on the Rust side.

[lints.rust]
# THE exception. packwandc-sys is the FFI boundary, so unsafe is its entire
# job; every other crate in the workspace keeps unsafe_code denied, and the
# safe wrapper in `packwandc` re-establishes the guarantee immediately above
# this one. See packwandc.md 6.1.
unsafe_code = "allow"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
private_intra_doc_links = "deny"
