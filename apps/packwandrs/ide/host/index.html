<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
		<meta id="vscode-workbench-web-configuration" data-settings="">
		<meta id="vscode-workbench-auth-session" data-settings="">
		<link rel="stylesheet" href="./core/out/vs/code/browser/workbench/workbench.css">
		<link rel="stylesheet" href="./bootstrap.css">
		<title>Packwand IDE</title>
	</head>
	<body aria-label="Packwand IDE">
		<div id="packwand-ide-early-diagnostic" style="box-sizing:border-box;min-height:100%;padding:24px;background:#1f222a;color:#e8eaf2;font:14px/1.5 system-ui,sans-serif;">
			<h1 style="margin:0 0 8px;font-size:18px">Packwand IDE is starting…</h1>
			<p style="margin:0;color:#8f96aa">If this message does not change, the host module script did not run. Check DevTools console/network for <code>bootstrap.js</code>.</p>
			<ul id="packwand-ide-early-diagnostic-log" style="margin:12px 0 0;padding-left:18px;color:#ffb4b4;font-family:ui-monospace,monospace;font-size:12px;"></ul>
		</div>
	</body>
	<script>
		(function () {
			var log = document.getElementById('packwand-ide-early-diagnostic-log');
			function report(text) {
				console.error('[packwand-ide]', text);
				if (!log) return;
				var item = document.createElement('li');
				item.textContent = text;
				log.appendChild(item);
			}
			window.addEventListener('error', function (event) {
				if (event.target && event.target !== window && 'src' in event.target) {
					report('resource failed to load: ' + event.target.src);
				} else {
					report('script error: ' + (event.message || event.error));
				}
			}, true);
			document.addEventListener('securitypolicyviolation', function (event) {
				report('CSP violation: ' + event.violatedDirective + ' blocked ' + event.blockedURI);
			});
			window.__packwandIdeMarkStarted = function () {
				var panel = document.getElementById('packwand-ide-early-diagnostic');
				if (panel) panel.remove();
			};
		})();
	</script>
	<script type="module" src="./bootstrap.js"></script>
</html>
