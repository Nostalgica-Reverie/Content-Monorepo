[package]
name = "packeater_cli"
description = "Aggressive, marker-driven Minecraft pack optimizer"
version.workspace = true
authors = ["Packeater contributors", "PackSquash contributors"]
repository.workspace = true
license.workspace = true
publish = false
edition.workspace = true

[[bin]]
name = "packeater"
path = "src/main.rs"

[dependencies]
packsquash = { path = "../packsquash" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = { version = "1.1.2", default-features = false, features = ["display", "parse", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
