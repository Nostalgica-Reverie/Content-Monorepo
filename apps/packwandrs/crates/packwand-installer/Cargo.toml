[package]
name = "packwand-installer"
description = "Native packwiz-compatible content installer for Packwand"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "packwand_installer"

[[bin]]
name = "packwand-installer"
path = "src/main.rs"

[dependencies]
clap.workspace = true
packwand-pack = { path = "../packwand-pack" }
packwand-parallel = { path = "../packwand-parallel" }
packwand-providers = { path = "../packwand-providers" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
