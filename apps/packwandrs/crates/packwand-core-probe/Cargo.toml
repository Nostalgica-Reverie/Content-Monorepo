[package]
name = "packwand-core-probe"
description = "Test/diagnostic CLI over the packwand-rs core crates (spike; not a product CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "packwand-core-probe"
path = "src/main.rs"

[[bin]]
name = "fake-java"
path = "src/bin/fake_java.rs"

[dependencies]
packwand-instance.workspace = true
packwand-launch.workspace = true
packwand-runtime.workspace = true
packwand-minecraft.workspace = true
packwand-auth.workspace = true
packwand-orchestrator = { path = "../packwand-orchestrator" }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiny_http = "0.12"
sha1.workspace = true
