[package]
name = "packwand-minecraft"
description = "Minecraft version metadata, install planning, and transactional installation for the packwand-rs shared core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
packwand-net = { path = "../packwand-net" }
packwand-pack = { path = "../packwand-pack" }
packwand-parallel = { path = "../packwand-parallel" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex-lite = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
packwand-net = { path = "../packwand-net", features = ["testing"] }
tempfile = { workspace = true }
