[package]
name = "packwand-net"
description = "One HTTP core for Packwand: shared agents, per-host pacing, retry policy, revalidating metadata cache, and verified streaming downloads"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
packwand-pack = { path = "../packwand-pack" }
packwand-parallel = { path = "../packwand-parallel" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true

[features]
# A loopback HTTP stub for tests. Off by default so nothing ships it.
testing = []

[dev-dependencies]
packwand-net = { path = ".", features = ["testing"] }
tempfile.workspace = true
