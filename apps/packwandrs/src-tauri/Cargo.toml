[package]
name = "packwand-gui"
description = "Packwand desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "packwand_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "packwand-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
packwand-build = { path = "../crates/packwand-build" }
packwand-diagnostics = { path = "../crates/packwand-diagnostics" }
ammonia.workspace = true
packwand-ops = { path = "../crates/packwand-ops" }
pulldown-cmark.workspace = true
packwand-parallel.workspace = true
packwand-pack = { path = "../crates/packwand-pack" }
packwand-providers = { path = "../crates/packwand-providers" }
packwand-workspace = { path = "../crates/packwand-workspace" }
# Launcher core: instance records, Minecraft/loader install, and process
# supervision. These crates stay Tauri-free; all Tauri glue for them lives in
# src/commands/instances.rs.
packwand-devboot.workspace = true
packwand-instance.workspace = true
packwand-launch.workspace = true
packwand-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true
walkdir.workspace = true
ignore = "0.4"
regex-lite.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
