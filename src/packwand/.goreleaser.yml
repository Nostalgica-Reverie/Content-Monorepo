version: 2

project_name: packwand
force_token: gitea

# Run from src/packwand (goreleaser release --clean, or via CI with
# working-directory: src/packwand). Tag releases as vX.Y.Z on the monorepo;
# dist/ output is already gitignored at the repo root.

before:
  hooks:
    - go mod tidy

builds:
  - id: packwiz-bootstrap
    main: ./cmd/packwiz-bootstrap
    binary: packwiz-bootstrap
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: packwand
    main: .
    binary: packwand
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X git.nostalgica.net/Reverie-Projects/monorepo/src/packwand/cmd.packwandVersion={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Reproducible builds: stamp file timestamps from the commit, not the build host.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: packwand
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Generate a CycloneDX SBOM for each shipped archive. GoReleaser uploads these
# documents as release artifacts beside the archives.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.cdx.json"
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

snapshot:
  version_template: "{{ incpatch .Version }}-devel"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(ci\\):"

# Publish releases to the Forgejo instance (Gitea-compatible API).
# Requires GITEA_TOKEN in the environment when running goreleaser release.
gitea_urls:
  api: https://git.nostalgica.net/api/v1
  download: https://git.nostalgica.net

release:
  gitea:
    owner: Reverie-Projects
    name: monorepo
  draft: false
  prerelease: auto
