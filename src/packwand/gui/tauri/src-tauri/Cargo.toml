[package]
name = "packwand-gui"
version = "0.1.0"
description = "Native desktop shell for the Packwand GUI"
authors = ["Lasting Legacy"]
license = "AGPL-3.0-or-later"
repository = "https://git.nostalgica.net/Lasting-Legacy/Lasting-Legacy-Monorepo"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
