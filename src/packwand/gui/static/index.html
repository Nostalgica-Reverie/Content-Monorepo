<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Packwand GUI</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">P</div>
          <div>
            <strong>Packwand</strong>
            <span id="repoRoot">Loading repo...</span>
          </div>
        </div>

        <label class="field-label" for="projectSelect">Current Project</label>
        <select id="projectSelect"></select>

        <nav>
          <button class="nav-btn active" data-view="overview">Open</button>
          <button class="nav-btn" data-view="exports">Exports</button>
          <button class="nav-btn" data-view="mods">Mods</button>
          <button class="nav-btn" data-view="changelog">Changelog</button>
          <button class="nav-btn" data-view="logs">Logs</button>
          <button class="nav-btn" data-view="settings">Settings</button>
        </nav>

        <div class="sidebar-footer">
          <div class="language-credit">
            <img class="gleam-logo" src="/lucy.svg" alt="" />
            <span>Frontend source in Gleam</span>
          </div>
          <span id="packwandVersion">packwand</span>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <h1 id="projectName">Packwand</h1>
            <p id="projectMeta"></p>
          </div>
          <div class="top-actions">
            <label class="search-wrap" for="packSearch">
              <span>Search</span>
              <input id="packSearch" type="search" placeholder="current pack..." />
            </label>
            <span id="searchStatus" class="pill" hidden></span>
            <img id="projectIcon" class="project-icon" alt="" hidden />
            <button id="refreshProjects" class="ghost">Refresh Index</button>
            <button id="validateAll" class="danger">Validate</button>
          </div>
        </header>

        <section class="toolbar" data-view-section="overview settings logs">
          <button data-action="workspace-status">Workspace Status</button>
          <button data-action="packs-index">Regenerate Projects</button>
          <button data-action="workspace-sync" data-dry-run="true">Dry Sync</button>
          <button data-action="workspace-refresh">Workspace Refresh</button>
        </section>

        <section class="grid">
          <div class="panel span-7" data-view-section="overview settings">
            <div class="panel-head">
              <h2>Project</h2>
              <span id="projectRole" class="pill"></span>
            </div>
            <div class="details" id="projectDetails"></div>
          </div>

          <div class="panel span-5" data-view-section="overview settings">
            <div class="panel-head">
              <h2>Subdirs</h2>
              <span id="subdirCount" class="pill"></span>
            </div>
            <div id="subdirList" class="list"></div>
          </div>

          <div class="panel span-12" data-view-section="overview exports">
            <div class="panel-head">
              <h2>Actions</h2>
            </div>
            <div class="action-row">
              <select id="subdirSelect"></select>
              <button data-subdir-action="refresh">Refresh</button>
              <button data-subdir-action="update-all">Update All</button>
              <button data-subdir-action="export-modrinth">MR Export</button>
              <button data-subdir-action="export-curseforge">CF Export</button>
            </div>
          </div>

          <div class="panel span-12" data-view-section="mods">
            <div class="panel-head">
              <h2>Add Mod</h2>
            </div>
            <div class="action-row">
              <input id="modSlugInput" placeholder="mod slug or search term..." />
              <button id="addModButton">Add</button>
            </div>
          </div>

          <div class="panel span-12" data-view-section="changelog">
            <div class="panel-head">
              <h2>Changelog</h2>
              <button class="ghost" id="copySummary">Copy Summary</button>
            </div>
            <div class="changelog-preview" id="changelogPreview"></div>
          </div>

          <div class="panel span-12" data-view-section="settings">
            <div class="panel-head">
              <h2>Manifest</h2>
              <button id="saveManifest" class="ghost">Save Manifest</button>
            </div>
            <textarea id="manifestEditor" spellcheck="false"></textarea>
          </div>

          <div class="panel span-12" data-view-section="settings">
            <div class="panel-head">
              <h2>New Pack</h2>
              <button id="createPack">Create</button>
            </div>
            <div class="form-grid">
              <label>
                <span>ID</span>
                <input id="newPackID" placeholder="my-new-pack" />
              </label>
              <label>
                <span>Name</span>
                <input id="newPackName" placeholder="My New Pack" />
              </label>
              <label>
                <span>Type</span>
                <select id="newPackType">
                  <option value="modpack">modpack</option>
                  <option value="resourcepack">resourcepack</option>
                  <option value="datapack">datapack</option>
                </select>
              </label>
              <label>
                <span>Loader</span>
                <input id="newPackLoader" placeholder="fabric" />
              </label>
              <label>
                <span>Minecraft</span>
                <input id="newPackMC" placeholder="1.21.1" />
              </label>
              <label>
                <span>Version</span>
                <input id="newPackVersion" placeholder="0.1.0" />
              </label>
              <label class="span-form">
                <span>Description</span>
                <input id="newPackDescription" placeholder="Optional summary" />
              </label>
            </div>
          </div>

          <div class="panel span-12" data-view-section="mods">
            <div class="panel-head">
              <h2>Mods</h2>
              <span id="modCount" class="pill">0 mods</span>
            </div>
            <div id="modList" class="list mod-list"></div>
          </div>

          <div class="panel span-12" data-view-section="overview">
            <div class="panel-head">
              <h2>Variants</h2>
            </div>
            <div id="variantList" class="variant-list"></div>
          </div>

          <div class="panel span-12" data-view-section="logs">
            <div class="panel-head">
              <h2>Command Logs</h2>
              <span id="jobStatus" class="pill">idle</span>
            </div>
            <pre id="logPane"></pre>
          </div>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
