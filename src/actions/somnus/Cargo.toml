[workspace]
members = [
    "core",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

walkdir = "2.5"
colored = "2.1"
chrono = "0.4"
git2 = "0.20.4"

thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6"