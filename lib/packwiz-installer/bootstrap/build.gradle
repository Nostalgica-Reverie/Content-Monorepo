plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow'
}

// Legacy Java bootstrap, kept for compatibility with existing pack instances.
// New installations should prefer the Go bootstrap (src/packwand/cmd/packwiz-bootstrap).
version = '1.0.0-packwand'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.eclipsesource.minimal-json:minimal-json:0.9.5'
    implementation 'commons-cli:commons-cli:1.4'
}

application {
    mainClass = 'link.infra.packwiz.installer.bootstrap.Main'
}

jar {
    manifest {
        attributes('Main-Class': 'link.infra.packwiz.installer.bootstrap.Main')
    }
}
