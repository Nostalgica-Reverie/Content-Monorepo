[workspace]
resolver = "2"
# The launcher-core crates moved into the packwandrs workspace
# (apps/packwandrs/crates). They are referenced below as plain path
# dependencies rather than members, so they are built and locked by
# packwandrs while the deprecated Go GUI below can still consume them.
members = [
    "apps/packwand/gui/tauri/src-tauri",
]
exclude = ["apps/mod-browser-webview"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://git.nostalgica.net/Lasting-Legacy/Lasting-Legacy-Monorepo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
sha1 = "0.10"
md-5 = "0.10"
regex-lite = "0.1"
ureq = { version = "2", features = ["gzip"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
packwand-instance = { path = "apps/packwandrs/crates/packwand-instance" }
packwand-launch = { path = "apps/packwandrs/crates/packwand-launch" }
packwand-runtime = { path = "apps/packwandrs/crates/packwand-runtime" }
packwand-minecraft = { path = "apps/packwandrs/crates/packwand-minecraft" }
packwand-auth = { path = "apps/packwandrs/crates/packwand-auth" }
packwand-devboot = { path = "apps/packwandrs/crates/packwand-devboot" }
packwand-msa = { path = "apps/packwandrs/crates/packwand-msa" }

[profile.release]
opt-level = "s"
lto = true
strip = true
# Single codegen unit lets LLVM optimize across the whole crate; costs some
# compile time on release builds only, keeps the size-tuned profile smaller.
codegen-units = 1

# plist 1.9.0 on crates.io pins the vulnerable quick-xml 0.39 line. This
# upstream revision keeps the same plist API while moving to quick-xml 0.41.
[patch.crates-io]
plist = { git = "https://github.com/ebarnard/rust-plist.git", rev = "0a2f9e79fe4b85abcfb8013a9f3c97e490750b50" }
