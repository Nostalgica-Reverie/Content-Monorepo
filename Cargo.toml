[workspace]
resolver = "2"
members = [
    "packages/packwand-core/crates/packwand-instance",
    "packages/packwand-core/crates/packwand-launch",
    "packages/packwand-core/crates/packwand-runtime",
    "packages/packwand-core/crates/packwand-minecraft",
    "packages/packwand-core/crates/packwand-auth",
    "packages/packwand-core/crates/packwand-devboot",
    "packages/packwand-core/crates/packwand-msa",
    "packages/packwand-core/crates/packwand-core-probe",
    "apps/packwand/gui/tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://git.nostalgica.net/Lasting-Legacy/Lasting-Legacy-Monorepo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
sha1 = "0.10"
md-5 = "0.10"
regex-lite = "0.1"
ureq = { version = "2", features = ["gzip"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
packwand-instance = { path = "packages/packwand-core/crates/packwand-instance" }
packwand-launch = { path = "packages/packwand-core/crates/packwand-launch" }
packwand-runtime = { path = "packages/packwand-core/crates/packwand-runtime" }
packwand-minecraft = { path = "packages/packwand-core/crates/packwand-minecraft" }
packwand-auth = { path = "packages/packwand-core/crates/packwand-auth" }
packwand-devboot = { path = "packages/packwand-core/crates/packwand-devboot" }
packwand-msa = { path = "packages/packwand-core/crates/packwand-msa" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# plist 1.9.0 on crates.io pins the vulnerable quick-xml 0.39 line. This
# upstream revision keeps the same plist API while moving to quick-xml 0.41.
[patch.crates-io]
plist = { git = "https://github.com/ebarnard/rust-plist.git", rev = "0a2f9e79fe4b85abcfb8013a9f3c97e490750b50" }
