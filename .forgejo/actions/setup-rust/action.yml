name: 'Setup Rust'
description: 'Stable Rust toolchain + Swatinem build cache, with optional GTK/WebKitGTK build deps for the webview/Tauri components.'

inputs:
  toolchain:
    description: "Toolchain channel to install (e.g. 'stable', 'nightly', '1.75.0')"
    required: false
    default: 'stable'
  components:
    description: "Toolchain components, comma-separated (e.g. 'clippy, rustfmt')"
    required: false
    default: ''
  targets:
    description: "Additional compilation targets, comma-separated (e.g. 'x86_64-pc-windows-msvc')"
    required: false
    default: ''
  workspaces:
    description: "Cargo workspaces for rust-cache (newline-separated, ' -> target' suffix optional)"
    required: false
    default: ''
  cache-key:
    description: 'Extra cache key segment (e.g. a matrix leg name)'
    required: false
    default: ''
  linux-deps:
    description: "Set 'true' to apt-install the GTK/WebKitGTK/libsoup dev packages the webview and Tauri builds need"
    required: false
    default: 'false'
  extra-packages:
    description: "Additional apt packages to install alongside linux-deps (e.g. 'nsis')"
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install Linux webview dependencies
      if: inputs.linux-deps == 'true'
      shell: bash
      run: |
        apt-get update
        apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev ${{ inputs.extra-packages }}

    - name: Install Rust toolchain
      uses: https://github.com/dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache Rust builds
      uses: https://github.com/Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
        key: ${{ inputs.cache-key }}
