name: "Setup Somnus"
description: "Cache-or-build the somnus binary; optionally install packwiz. Requires Go on PATH — run actions/setup-go in the workflow before this action."

inputs:
  install-somnus:
    description: "Cache-or-build the somnus binary"
    required: false
    default: "true"
  install-packwiz:
    description: "Install packwiz"
    required: true
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Cache Somnus Binary
      if: inputs.install-somnus == 'true'
      uses: actions/cache@v4
      with:
        path: ./somnus-bin
        key: somnus-go-v1-${{ runner.os }}-${{ hashFiles('src/actions/somnus/**/*.go', 'src/actions/somnus/go.mod') }}

    - name: Cache Packwiz Binary
      if: inputs.install-packwiz == 'true'
      uses: actions/cache@v4
      with:
        path: ~/go/bin
        key: go-bin-packwiz-v1-${{ runner.os }}

    - name: Build Somnus
      if: inputs.install-somnus == 'true'
      shell: bash
      run: |
        if [ -x ./somnus-bin/somnus ]; then
          echo "somnus: restored from cache, skipping build"
          exit 0
        fi
        go build -C src/actions/somnus -o "$GITHUB_WORKSPACE/somnus-bin/somnus" .
        chmod +x ./somnus-bin/somnus

    - name: Install Packwiz
      if: inputs.install-packwiz == 'true'
      shell: bash
      run: |
        if [ -x "$HOME/go/bin/packwiz" ]; then
          echo "packwiz: restored from cache, skipping install"
          exit 0
        fi
        go install github.com/packwiz/packwiz@latest

    - name: Export Paths
      if: inputs.install-packwiz == 'true'
      shell: bash
      run: |
        echo "$HOME/go/bin" >> "$GITHUB_PATH"
        echo "PACKWIZ_BIN=$HOME/go/bin/packwiz" >> "$GITHUB_ENV"