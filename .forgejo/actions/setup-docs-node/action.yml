name: "Setup Bun (docs sites)"
description: "Pinned Bun runtime with its install cache keyed on the monorepo lockfile."

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: https://github.com/oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    - name: Cache Bun installs
      uses: https://code.forgejo.org/actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-docs-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-docs-${{ runner.os }}-
