name: "Setup Packwand"
description: "Install Rust"

runs:
  using: "composite"
  steps:
    - name: Setup Packwand Rust toolchain
      uses: ./.forgejo/actions/setup-rust
      with:
        workspaces: apps/packwandrs
        cache-key: packwand-cli-release

    - name: Build Packwand CLI
      shell: bash
      working-directory: apps/packwandrs
      run: cargo build --locked --release -p packwand-cli

    - name: Export Packwand CLI
      shell: bash
      run: |
        PACKWAND_BIN="$GITHUB_WORKSPACE/apps/packwandrs/target/release/packwand"
        test -x "$PACKWAND_BIN"
        echo "$(dirname "$PACKWAND_BIN")" >> "$GITHUB_PATH"
        echo "PACKWAND_BIN=$PACKWAND_BIN" >> "$GITHUB_ENV"
