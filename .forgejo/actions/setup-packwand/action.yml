name: 'Setup Packwand'
description: 'Clone bundle (the packwand/bundle CLI) from Tangled and build it'

runs:
  using: 'composite'
  steps:
    - name: Clone bundle from Tangled
      shell: bash
      run: git clone --depth 1 https://tangled.org/nostalgica.net/bundle "$RUNNER_TEMP/bundle-src"

    - name: Install native build tooling
      shell: bash
      run: |
        apt-get update
        apt-get install -y cmake

    - name: Setup Packwand Rust toolchain
      uses: ./.forgejo/actions/setup-rust
      with:
        toolchain: nightly
        workspaces: ${{ runner.temp }}/bundle-src
        cache-key: packwand-cli-release

    - name: Work around bundle's Windows-only sandbox export
      shell: bash
      working-directory: ${{ runner.temp }}/bundle-src
      run: |
        set -eu
        source=crates/bundle-platform/src/lib.rs
        buggy='pub use sandbox::{ProcessSandbox, ProcessSpec, SandboxedProcess, delete_profile, profile_name};'
        if grep -Fqx "$buggy" "$source"; then
          sed -i \
            's/^pub use sandbox::{ProcessSandbox, ProcessSpec, SandboxedProcess, delete_profile, profile_name};$/pub use sandbox::{ProcessSandbox, ProcessSpec, delete_profile, profile_name};\n#[cfg(windows)]\npub use sandbox::SandboxedProcess;/' \
            "$source"
        fi
        if grep -Fqx "$buggy" "$source"; then
          echo "::error::failed to gate bundle-platform's Windows-only SandboxedProcess export" >&2
          exit 1
        fi

    - name: Work around bundle's dasp_signal no_std bug
      # crates/bundle-packsquash/Cargo.toml pins `dasp_signal` with
      # `default-features = false`, which routes it through a `not(std)`
      # fallback calling unstable `core::intrinsics::{sinf64,floorf64,
      # ceilf64}`. Those were removed from nightly before 2026-09-03 (the
      # exact toolchain this job installs), so the crate no longer compiles.
      # bundle-packsquash uses std everywhere else, so drop the flag. This
      # also pulls in dasp_signal's optional dasp_envelope/dasp_rms/
      # dasp_window deps (its `std` feature enables them via old-style
      # `dep/feature` syntax), which the checked-in lockfile doesn't have --
      # `cargo update -p` re-syncs just those entries, without touching
      # anything else `--locked` will pin for the real build below. Remove
      # this step once upstream fixes the pin.
      shell: bash
      working-directory: ${{ runner.temp }}/bundle-src
      run: |
        set -eu
        manifest=crates/bundle-packsquash/Cargo.toml
        sed -i 's/^dasp_signal = .*default-features = false.*/dasp_signal = "0.11.0"/' "$manifest"
        if grep -q '^dasp_signal = .*default-features = false' "$manifest"; then
          echo "::error::dasp_signal line in $manifest didn't match the expected pattern -- upstream likely changed it, update this workaround" >&2
          exit 1
        fi
        cargo update -p dasp_signal

    - name: Build Packwand CLI
      shell: bash
      working-directory: ${{ runner.temp }}/bundle-src
      run: cargo build --locked --release -p bundle-cli --bin packwand

    - name: Export Packwand CLI
      shell: bash
      run: |
        PACKWAND_BIN="$RUNNER_TEMP/bundle-src/target/release/packwand"
        test -x "$PACKWAND_BIN"
        echo "$(dirname "$PACKWAND_BIN")" >> "$GITHUB_PATH"
        echo "PACKWAND_BIN=$PACKWAND_BIN" >> "$GITHUB_ENV"
