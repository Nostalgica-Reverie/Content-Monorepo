name: "CI - hashutil"

# tools/hashutil is CI/dev tooling only (not shipped in packwand release
# binaries -- see c.md section 1.7), so it gets its own narrowly-scoped
# workflow rather than folding into ci-go.yml (wrong toolchain) or
# ci-infra.yml (repo-wide meta-linting, not component builds).

on:
  push:
    branches: ["main"]
    paths:
      - "tools/hashutil/**"
      - "justfile"
      - ".forgejo/actions/setup-just/**"
      - ".forgejo/workflows/ci-hashutil.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/hashutil/**"
      - "justfile"
      - ".forgejo/actions/setup-just/**"
      - ".forgejo/workflows/ci-hashutil.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hashutil:
    runs-on: technocality
    timeout-minutes: 15
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            tools/hashutil
            justfile
            .forgejo/actions

      - uses: ./.forgejo/actions/setup-just

      - name: Install hashutil toolchain (compiler, formatter, static analyzer, mingw-w64 cross-compiler)
        run: |
          apt-get update
          apt-get install -y build-essential clang-format clang-tidy gcc-mingw-w64-x86-64

      - name: Format check
        run: just lint-hashutil

      - name: Static analysis (clang-tidy)
        # --header-filter: clang-tidy only checks the primary file (hashutil.c)
        # by default and silently skips included headers -- without this flag,
        # findings in sha256.h/sha512.h/md5.h/murmur2.h would never surface
        # here even though .clang-tidy's WarningsAsErrors would otherwise fail
        # the build on them.
        working-directory: tools/hashutil
        run: clang-tidy --header-filter='.*/(sha256|sha512|md5|murmur2)\.h$' hashutil.c -- -std=c2x

      - name: Build + self-test under AddressSanitizer + UndefinedBehaviorSanitizer
        working-directory: tools/hashutil
        run: |
          set -eu
          clang -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -std=c2x -o hashutil-sanitized hashutil.c
          ./hashutil-sanitized --selftest

          # Exercise the file-reading path (not just the in-memory self-test
          # vectors) under the sanitizers too: a real file, an empty file,
          # and a missing path (the per-file error branch).
          echo -n "sanitizer smoke test content" > /tmp/hashutil-fixture.txt
          : > /tmp/hashutil-fixture-empty.txt
          printf '/tmp/hashutil-fixture.txt\n/tmp/hashutil-fixture-empty.txt\n/tmp/does-not-exist\n' \
            | ./hashutil-sanitized

      # No Windows/macOS CI runner exists in this repo (see gui-release.yml's
      # own note on this). Cross-compiling hashutil.exe here is a build-only
      # smoke check -- it is not executed or sanitizer-tested on this Linux
      # runner. Windows correctness testing happens on a Windows
      # contributor's own machine until real Windows CI runner infra
      # exists; see c.md section 1.6/1.8.
      - name: Cross-compile Windows build (smoke check only, not executed)
        working-directory: tools/hashutil
        run: x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -std=c2x -o hashutil.exe hashutil.c
