# packwandc is the native core: a C kernel and modules orchestrated from Rust.
# It gets its own workflow rather than folding into ci-rust.yml because it
# needs a different toolchain (clang, CMake, Ninja, clang-tidy) and runs a
# different set of legs (sanitizers, fuzzing, a Windows cross-build). This
# mirrors the reasoning in the removed ci-hashutil.yml.
#
# The Rust crates under packwandc/crates/ are members of the packwandrs
# workspace, so ci-rust.yml already builds and tests them; this workflow owns
# the C side and the cross-language gate.
#
# See apps/packwandrs/packwandc/packwandc.md section 9.2.
name: "CI - packwandc"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/packwandrs/packwandc/**"
      - "justfile"
      - ".forgejo/actions/setup-c/**"
      - ".forgejo/actions/setup-just/**"
      - ".forgejo/workflows/ci-packwandc.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/packwandrs/packwandc/**"
      - "justfile"
      - ".forgejo/actions/setup-c/**"
      - ".forgejo/actions/setup-just/**"
      - ".forgejo/workflows/ci-packwandc.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap static checks first: a formatting slip should fail in seconds, not
  # after a sanitizer build.
  gate:
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/packwandrs/packwandc
            justfile
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-c
      - uses: ./.forgejo/actions/setup-just

      # clang-tidy needs compile_commands.json, so a build tree must exist
      # before the gate runs. PWC_GATE_STRICT makes the gate FAIL rather than
      # skip if it is missing -- a silently skipped check in CI is worse than
      # no check.
      - name: Configure build tree
        working-directory: apps/packwandrs/packwandc
        run: cmake --preset linux-dev

      - name: Quality gate
        working-directory: apps/packwandrs/packwandc
        env:
          PWC_GATE_STRICT: "1"
        run: sh scripts/gate.sh

  build-and-test:
    runs-on: technocality
    timeout-minutes: 20
    needs: gate
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/packwandrs/packwandc
            justfile
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-c
        with:
          cache-key: build
      - uses: ./.forgejo/actions/setup-just
      - name: Build and unit test
        run: just test-packwandc

  sanitizers:
    runs-on: technocality
    timeout-minutes: 30
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # Both legs are Linux-only, and not by choice: clang rejects
        # -fsanitize=thread for x86_64-pc-windows-msvc outright, and the
        # Windows dev toolchain ships no compiler-rt. See packwandc.md 7.4.
        leg: [asan, tsan]
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/packwandrs/packwandc
            justfile
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-c
        with:
          cache-key: ${{ matrix.leg }}
      - uses: ./.forgejo/actions/setup-just
      - name: Run ${{ matrix.leg }}
        run: just test-packwandc-${{ matrix.leg }}

  coverage:
    runs-on: technocality
    timeout-minutes: 20
    needs: gate
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/packwandrs/packwandc
            justfile
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-c
        with:
          cache-key: coverage
      # Reported, not enforced. The floors in packwandc.md 7.4 are provisional
      # placeholders and get set from phase 1's measured numbers (12.3), so
      # this leg must not fail the build on a percentage.
      - name: Build and run with coverage instrumentation
        working-directory: apps/packwandrs/packwandc
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          ctest --preset coverage
      - name: Report coverage
        working-directory: apps/packwandrs/packwandc
        run: |
          cd build/coverage
          llvm-profdata merge -sparse default.profraw -o packwandc.profdata
          llvm-cov report ./pwc_test_core -instr-profile=packwandc.profdata

  windows-cross:
    runs-on: technocality
    timeout-minutes: 20
    needs: gate
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/packwandrs/packwandc
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-c
        with:
          cache-key: windows-cross
          xwin: "true"
      - name: Cross-build MSVC ABI library
        working-directory: apps/packwandrs/packwandc
        run: |
          cmake -S . -B build/windows-cross -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=scripts/toolchain-windows-msvc.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPWC_BUILD_TESTS=OFF
          cmake --build build/windows-cross --target packwandc
