name: "Auto Update & Refresh"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  auto-update:
    runs-on: technocality
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            modpacks
            src/actions/maintain

      - name: Cache Maintain Binary
        id: cache-maintain
        uses: actions/cache@v4
        with:
          path: ./maintain-bin
          key: maintain-go-v1-${{ runner.os }}-${{ hashFiles('src/actions/maintain/**/*.go', 'src/actions/maintain/go.mod') }}

      - name: Setup Go
        if: steps.cache-maintain.outputs.cache-hit != 'true'
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build Maintain
        if: steps.cache-maintain.outputs.cache-hit != 'true'
        run: |
          go build -C src/actions/maintain -o "$GITHUB_WORKSPACE/maintain-bin/maintain" .
          chmod +x ./maintain-bin/maintain

      - name: Cache Packwiz Binary
        id: cache-packwiz
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-bin-packwiz-v1-${{ runner.os }}

      - name: Setup Go Dos
        if: steps.cache-packwiz.outputs.cache-hit != 'true' && steps.cache-maintain.outputs.cache-hit == 'true'
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Packwiz
        if: steps.cache-packwiz.outputs.cache-hit != 'true'
        run: go install github.com/packwiz/packwiz@latest

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run Update
        run: ./maintain-bin/maintain update

      - name: Commit
        uses: https://github.com/EndBug/add-and-commit@v9
        with:
          author_name: forgejo-actions[bot]
          author_email: omo50@noreply.nostalgica.net
          message: 'actions: auto-update (${{ github.workflow }})'
          add: 'modpacks'
