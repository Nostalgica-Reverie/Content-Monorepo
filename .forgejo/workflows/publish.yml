name: "Publish"

on:
  push:
    branches: ["main"]
    paths:
      - 'modpacks/**'
      - 'datapacks/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: technocality
    outputs:
      entries: ${{ steps.expand.outputs.entries }}
      has_entries: ${{ steps.expand.outputs.has_entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            modpacks
            datapacks
            src/actions/somnus
            .forgejo/actions

      - name: Set up Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup Somnus
        uses: ./.forgejo/actions/setup-somnus
        with:
          install-somnus: 'true'
          install-packwiz: 'false'

      - name: Expand changed manifests into matrix entries
        id: expand
        run: |
          set -eu

          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)

          CANDIDATES=$(echo "$CHANGED" | grep -E '^(modpacks|datapacks)/[^/]+/manifest\.json$' || true)
          PROD=""
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            NEWV=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('$m','utf8')).version ?? '')")
            OLDV=$(git show "HEAD^:$m" 2>/dev/null | bun -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).version ?? '')}catch{console.log('')}})" || echo "")
            if [ "$NEWV" != "$OLDV" ] && [ -n "$NEWV" ]; then
              echo "version change in $m: '$OLDV' -> '$NEWV'"
              PROD="${PROD}${m}"$'\n'
            else
              echo "skipping $m (version unchanged: '$NEWV')"
            fi
          done <<< "$CANDIDATES"

          CHANGED_PACKS=$(echo "$CHANGED" | grep -E '^(modpacks|datapacks)/[^/]+/' | cut -d/ -f1-2 | sort -u || true)
          EXP=""
          while IFS= read -r pack; do
            [ -n "$pack" ] || continue
            if [ -f "$pack/manifest-experimental.json" ]; then
              EXP="${EXP}${pack}/manifest-experimental.json"$'\n'
            fi
          done <<< "$CHANGED_PACKS"

          MANIFESTS=$(printf '%s\n%s' "$PROD" "$EXP" | grep -v '^$' | awk '!seen[$0]++' || true)

          if [ -z "$MANIFESTS" ]; then
            echo "has_entries=false" >> "$GITHUB_OUTPUT"
            echo "entries=[]" >> "$GITHUB_OUTPUT"
            echo "no manifests to publish."
            exit 0
          fi

          ALL="[]"
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            PART=$(./somnus-bin/somnus publish list "$m")
            ALL=$(bun -e "const a=$ALL,b=$PART;console.log(JSON.stringify(a.concat(b)))")
          done <<< "$MANIFESTS"

          echo "has_entries=true" >> "$GITHUB_OUTPUT"
          echo "entries=$ALL" >> "$GITHUB_OUTPUT"
          echo "matrix entries: $ALL"

  publish:
    needs: detect
    if: needs.detect.outputs.has_entries == 'true'
    runs-on: technocality
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        entry: ${{ fromJson(needs.detect.outputs.entries) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 5
          filter: blob:none
          sparse-checkout: |
            modpacks
            datapacks
            src/actions/somnus
            tools/changelog
            .forgejo/actions

      - name: Setup Go
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup Somnus
        uses: ./.forgejo/actions/setup-somnus
        with:
          install-somnus: 'true'
          install-packwiz: 'true'

      - name: Set up Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate Manifest
        run: ./somnus-bin/somnus validate "${{ matrix.entry.manifest }}"

      - name: Generate Changelog
        id: changelog
        run: bun tools/changelog/generate-changelog.ts "${{ matrix.entry.manifest }}"

      - name: Run Publisher (build this entry)
        id: meta
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          export PACKWIZ_BIN="$HOME/go/bin/packwiz"
          VARIANT='${{ matrix.entry.variant }}'
          if [ "$VARIANT" = "null" ] || [ -z "$VARIANT" ]; then
            ./somnus-bin/somnus publish build "${{ matrix.entry.manifest }}"
          else
            ./somnus-bin/somnus publish build "${{ matrix.entry.manifest }}" "$VARIANT"
          fi

      - name: Stagger publish timing (preserve display order)
        run: |
          ORDER='${{ matrix.entry.order }}'
          if [ -n "$ORDER" ] && [ "$ORDER" != "0" ] && [ "$ORDER" != "null" ]; then
            echo "entry order $ORDER -> 3s gap to keep publish timestamps strictly ordered"
            sleep 3
          else
            echo "first entry -> no delay"
          fi

      - name: Upload to Modrinth
        if: steps.meta.outputs.mr_id != ''
        uses: https://github.com/Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.meta.outputs.mr_id }}
          modrinth-token: ${{ secrets.MR }}
          files: "${{ github.workspace }}/${{ steps.meta.outputs.path }}/artifacts/*.mrpack"
          name: "${{ steps.meta.outputs.name }}"
          version: "${{ steps.meta.outputs.ver }}"
          version-type: ${{ steps.meta.outputs.release_type }}
          changelog: "${{ steps.changelog.outputs.notes }}"
          loaders: ${{ steps.meta.outputs.type == 'modpack' && steps.meta.outputs.loader || 'minecraft' }}
          game-versions: "${{ steps.meta.outputs.mc }}"

      - name: Upload to CurseForge
        if: steps.meta.outputs.cf_id != ''
        uses: https://github.com/Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ steps.meta.outputs.cf_id }}
          curseforge-token: ${{ secrets.CF }}
          files: "${{ github.workspace }}/${{ steps.meta.outputs.path }}/artifacts/*.zip"
          name: "${{ steps.meta.outputs.name }}"
          version: "${{ steps.meta.outputs.ver }}"
          version-type: ${{ steps.meta.outputs.release_type }}
          changelog: "${{ steps.changelog.outputs.notes }}"
          loaders: ${{ steps.meta.outputs.type == 'modpack' && steps.meta.outputs.loader || 'minecraft' }}
          game-versions: "${{ steps.meta.outputs.mc }}"