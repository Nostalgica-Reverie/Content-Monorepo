name: "Publish"

on:
  push:
    branches: ["main"]
    paths:
      - 'modpacks/**'
      - 'datapacks/**'
      - 'resourcepacks/**'
      - 'mods/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: technocality
    outputs:
      entries: ${{ steps.plan.outputs.entries }}
      has_entries: ${{ steps.plan.outputs.has_entries }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            modpacks
            datapacks
            mods
            apps/packwand
            .forgejo/actions

      - name: Setup Go
        uses: ./.forgejo/actions/setup-go

      - name: Setup Packwand
        uses: ./.forgejo/actions/setup-packwand

      - name: Compute publish plan
        id: plan
        run: packwand publish plan

  publish:
    needs: detect
    if: needs.detect.outputs.has_entries == 'true'
    runs-on: technocality
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        entry: ${{ fromJson(needs.detect.outputs.entries) }}
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 5
          filter: blob:none
          sparse-checkout: |
            modpacks
            datapacks
            mods
            apps/packwand
            tools/changelog
            .forgejo/actions

      - name: Setup Go
        uses: ./.forgejo/actions/setup-go

      - name: Setup Packwand
        uses: ./.forgejo/actions/setup-packwand

      - name: Set up Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Java for mod builds
        uses: ./.forgejo/actions/setup-java
        with:
          java-version: "25"

      - name: Preflight content and manifest
        run: packwand preflight "$(dirname '${{ matrix.entry.manifest }}')"

      - name: Minify JSON (smaller published artifacts)
        run: packwand json minify "$(dirname '${{ matrix.entry.manifest }}')"

      - name: Generate Changelog
        run: bun tools/changelog/generate-changelog.ts "${{ matrix.entry.manifest }}" "$RUNNER_TEMP/release-notes.md"

      - name: Build artifacts
        env:
          GITHUB_SHA: ${{ github.sha }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          VARIANT='${{ matrix.entry.variant }}'
          if [ "$VARIANT" = "null" ] || [ -z "$VARIANT" ]; then
            packwand publish build "${{ matrix.entry.manifest }}"
          else
            packwand publish build "${{ matrix.entry.manifest }}" "$VARIANT"
          fi

      - name: Stagger publish timing (preserve display order)
        run: |
          ORDER='${{ matrix.entry.order }}'
          if [ -n "$ORDER" ] && [ "$ORDER" != "0" ] && [ "$ORDER" != "null" ]; then
            echo "entry order $ORDER -> 3s gap to keep publish timestamps strictly ordered"
            sleep 3
          else
            echo "first entry -> no delay"
          fi

      - name: Upload
        env:
          GITHUB_SHA: ${{ github.sha }}
          MODRINTH_TOKEN: ${{ secrets.MR }}
          CURSEFORGE_TOKEN: ${{ secrets.CF }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          VARIANT='${{ matrix.entry.variant }}'
          if [ "$VARIANT" = "null" ] || [ -z "$VARIANT" ]; then
            packwand publish upload --live --changelog-file "$RUNNER_TEMP/release-notes.md" "${{ matrix.entry.manifest }}"
          else
            packwand publish upload --live --changelog-file "$RUNNER_TEMP/release-notes.md" "${{ matrix.entry.manifest }}" "$VARIANT"
          fi

      - name: Verify (Modrinth)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          VARIANT='${{ matrix.entry.variant }}'
          if [ "$VARIANT" = "null" ] || [ -z "$VARIANT" ]; then
            packwand publish verify "${{ matrix.entry.manifest }}"
          else
            packwand publish verify "${{ matrix.entry.manifest }}" "$VARIANT"
          fi

  # Nix is a publish surface too: downstream flakes consume the checksum
  # inventories through legacyPackages, so every release must leave the flake
  # evaluating and its modpack-inventory check passing. Runs after publish so
  # a Nix failure can't retroactively block an upload that already succeeded —
  # it fails loudly on its own.
  nix-verify:
    needs: publish
    runs-on: technocality
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/api
            apps/packwand
            modpacks
            packages/packwand2nix
            flake.nix
            flake.lock
            justfile
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-nix
      - uses: ./.forgejo/actions/setup-just
      - name: Evaluate Nix outputs
        run: just lint-nix
      - name: Run Nix checks
        run: just test-nix
