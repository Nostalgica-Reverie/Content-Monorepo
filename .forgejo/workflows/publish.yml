name: "Publish"

on:
  push:
    branches: ["main"]
    paths:
      - 'modpacks/**'
      - 'datapacks/**'
  workflow_dispatch:

jobs:
  detect:
    runs-on: technocality
    outputs:
      entries: ${{ steps.expand.outputs.entries }}
      has_entries: ${{ steps.expand.outputs.has_entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            modpacks
            datapacks
            src/actions/publish

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Publisher Binary
        id: cache-publisher
        uses: actions/cache@v4
        with:
          path: ./publisher-bin
          key: publisher-v4-${{ runner.os }}-${{ hashFiles('src/actions/publish/**/*.rs', 'src/actions/publish/Cargo.toml', 'src/actions/publish/Cargo.lock') }}

      - name: Install Rust
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Rust Cache
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: "src/actions/publish -> target"

      - name: Build Publisher
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        run: |
          cargo build --release --manifest-path src/actions/publish/Cargo.toml --bin publish
          mkdir -p ./publisher-bin
          cp src/actions/publish/target/release/publish ./publisher-bin/publish

      - name: Expand changed manifests into matrix entries
        id: expand
        run: |
          set -eu
          chmod +x ./publisher-bin/publish

          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)

          PROD=$(echo "$CHANGED" | grep -E '^(modpacks|datapacks)/[^/]+/manifest\.json$' || true)

          CHANGED_PACKS=$(echo "$CHANGED" | grep -E '^(modpacks|datapacks)/[^/]+/' | cut -d/ -f1-2 | sort -u || true)
          EXP=""
          while IFS= read -r pack; do
            [ -n "$pack" ] || continue
            if [ -f "$pack/manifest-experimental.json" ]; then
              EXP="${EXP}${pack}/manifest-experimental.json"$'\n'
            fi
          done <<< "$CHANGED_PACKS"

          MANIFESTS=$(printf '%s\n%s' "$PROD" "$EXP" | grep -v '^$' | sort -u || true)

          if [ -z "$MANIFESTS" ]; then
            echo "has_entries=false" >> "$GITHUB_OUTPUT"
            echo "entries=[]" >> "$GITHUB_OUTPUT"
            echo "no manifests to publish."
            exit 0
          fi

          ALL="[]"
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            PART=$(./publisher-bin/publish list "$m")
            ALL=$(node -e "const a=$ALL,b=$PART;console.log(JSON.stringify(a.concat(b)))")
          done <<< "$MANIFESTS"

          echo "has_entries=true" >> "$GITHUB_OUTPUT"
          echo "entries=$ALL" >> "$GITHUB_OUTPUT"
          echo "matrix entries: $ALL"

  publish:
    needs: detect
    if: always()
    runs-on: technocality
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        entry: ${{ fromJson(needs.detect.outputs.entries) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            modpacks
            datapacks
            src/actions/publish
            tools/changelog
            tools/manifest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Manifest
        run: npx tsx tools/manifest/validate.ts "${{ matrix.entry.manifest }}"

      - name: Cache Publisher Binary
        id: cache-publisher
        uses: actions/cache@v4
        with:
          path: ./publisher-bin
          key: publisher-v4-${{ runner.os }}-${{ hashFiles('src/actions/publish/**/*.rs', 'src/actions/publish/Cargo.toml', 'src/actions/publish/Cargo.lock') }}

      - name: Install Rust
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Rust Cache
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: "src/actions/publish -> target"

      - name: Build Publisher
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        run: |
          cargo build --release --manifest-path src/actions/publish/Cargo.toml --bin publish
          mkdir -p ./publisher-bin
          cp src/actions/publish/target/release/publish ./publisher-bin/publish

      - name: Generate Changelog
        id: changelog
        run: npx tsx tools/changelog/generate-changelog.ts "${{ matrix.entry.manifest }}"

      - name: Cache Packwiz Binaries
        id: cache-go
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-bin-packwiz-v1-${{ runner.os }}

      - name: Setup Go
        if: steps.cache-go.outputs.cache-hit != 'true'
        uses: https://github.com/actions/setup-go@v5
        with: { go-version: 'stable', cache: true }

      - name: Install Packwiz
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: go install github.com/packwiz/packwiz@latest

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run Publisher (build this entry)
        id: meta
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x ./publisher-bin/publish
          VARIANT='${{ matrix.entry.variant }}'
          if [ "$VARIANT" = "null" ] || [ -z "$VARIANT" ]; then
            ./publisher-bin/publish build "${{ matrix.entry.manifest }}"
          else
            ./publisher-bin/publish build "${{ matrix.entry.manifest }}" "$VARIANT"
          fi

      - name: Upload to Modrinth
        if: steps.meta.outputs.mr_id != ''
        uses: https://github.com/Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.meta.outputs.mr_id }}
          modrinth-token: ${{ secrets.MR }}
          files: "${{ github.workspace }}/${{ steps.meta.outputs.path }}/artifacts/*.mrpack"
          name: "${{ steps.meta.outputs.name }}"
          version: "${{ steps.meta.outputs.ver }}"
          version-type: ${{ steps.meta.outputs.release_type }}
          changelog: "${{ steps.changelog.outputs.notes }}"
          loaders: ${{ steps.meta.outputs.type == 'modpack' && steps.meta.outputs.loader || 'minecraft' }}
          game-versions: "${{ steps.meta.outputs.mc }}"

      - name: Upload to CurseForge
        if: steps.meta.outputs.cf_id != ''
        uses: https://github.com/Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ steps.meta.outputs.cf_id }}
          curseforge-token: ${{ secrets.CF }}
          files: "${{ github.workspace }}/${{ steps.meta.outputs.path }}/artifacts/*.zip"
          name: "${{ steps.meta.outputs.name }}"
          version: "${{ steps.meta.outputs.ver }}"
          version-type: ${{ steps.meta.outputs.release_type }}
          changelog: "${{ steps.changelog.outputs.notes }}"
          loaders: ${{ steps.meta.outputs.type == 'modpack' && steps.meta.outputs.loader || 'minecraft' }}
          game-versions: "${{ steps.meta.outputs.mc }}"
