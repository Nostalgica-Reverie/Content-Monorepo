name: 'Auto-Update Drift Report'

# Report-only: packs opted out of auto-update (via manifest.json
# automation.auto_update or the legacy auto-update-ignore.json) never get
# checked by auto-update.yml, so there's no visibility into how far behind
# they've fallen. This never commits anything — it just posts a summary.
#
# A docs broken-link check for the VitePress sites (codex.md §4.3, tying into
# this same report per codex.md §3.6) is intentionally not bundled here: it's
# Agent 2's docs/** territory and depends on tooling that doesn't exist yet.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-report:
    runs-on: technocality
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Setup Packwand
        uses: ./.forgejo/actions/setup-packwand

      - name: Check drift on opted-out packs
        id: drift
        shell: bash
        continue-on-error: true
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: packwand batch update --check --json --ignored-only > "$RUNNER_TEMP/drift.json"

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Auto-update drift report"
            echo
            if [ ! -s "$RUNNER_TEMP/drift.json" ]; then
              echo "_No output was captured — the check step failed to run at all._"
              exit 0
            fi
            SUBDIR_COUNT=$(jq '.subdirs | length' "$RUNNER_TEMP/drift.json")
            TOTAL_UPDATES=$(jq '.total_updates' "$RUNNER_TEMP/drift.json")
            FAILED=$(jq '.failed_checks' "$RUNNER_TEMP/drift.json")
            if [ "$SUBDIR_COUNT" = "0" ]; then
              echo "No packs are currently opted out of auto-update."
            else
              echo "$SUBDIR_COUNT opted-out pack subdir(s) checked, $TOTAL_UPDATES update(s) available, $FAILED check failure(s)."
              echo
              echo "| Subdir | Status |"
              echo "| --- | --- |"
              jq -r '.subdirs[] | "| " + .dir + " | " + (if .error then "⚠️ " + .error elif (.updates | length) > 0 then (.updates | length | tostring) + " update(s) behind" else "up to date" end) + " |"' "$RUNNER_TEMP/drift.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check variant parity (mr vs cf)
        id: parity
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          url_file="$RUNNER_TEMP/packwand-api-url"
          log_file="$RUNNER_TEMP/packwand-api.log"
          packwand api serve --print-port-file "$url_file" > "$log_file" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            if [ -s "$url_file" ]; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$log_file" >&2
              exit 1
            fi
            sleep 0.1
          done
          if [ ! -s "$url_file" ]; then
            echo "Packwand API did not become ready" >&2
            cat "$log_file" >&2
            exit 1
          fi
          api_url="$(tr -d '\r\n' < "$url_file")"
          curl -fsS "${api_url%/}/api/v3/diagnostics/parity" > "$RUNNER_TEMP/parity.json"

      - name: Write parity summary
        shell: bash
        run: |
          {
            echo
            echo "## Variant parity report (mr vs cf)"
            echo
            if [ ! -s "$RUNNER_TEMP/parity.json" ]; then
              echo "_No output was captured — the parity step failed to run at all._"
              exit 0
            fi
            echo "| Pack / variant | Status |"
            echo "| --- | --- |"
            jq -r '.[] | "| " + .pack + "/" + .variant + " | " + (if .drifted then "⚠️ drift detected" else "in parity" end) + " |"' "$RUNNER_TEMP/parity.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on check errors
        # total_updates > 0 and parity drift are expected findings (that's the
        # whole point of this report) and must not fail the job; only genuine
        # check errors do.
        if: steps.drift.outcome == 'failure' || steps.parity.outcome == 'failure'
        run: exit 1
