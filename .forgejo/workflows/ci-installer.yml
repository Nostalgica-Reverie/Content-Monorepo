name: "CI - Installer"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/packwand-installer/**"
      - "Taskfile.yml"
      - ".forgejo/actions/setup-java/**"
      - ".forgejo/actions/setup-task/**"
      - ".forgejo/workflows/ci-installer.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/packwand-installer/**"
      - "Taskfile.yml"
      - ".forgejo/actions/setup-java/**"
      - ".forgejo/actions/setup-task/**"
      - ".forgejo/workflows/ci-installer.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: technocality
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/packwand-installer
            tools
            Taskfile.yml
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-java
      - uses: ./.forgejo/actions/setup-task
      - name: Lint installer
        run: task lint-installer
      - name: Test installer
        run: task test-installer
      - name: Build installer
        run: task build-installer
      - name: Checksum installer snapshot
        if: github.ref == 'refs/heads/main'
        working-directory: apps/packwand-installer/build/dist
        run: sha256sum packwiz-installer.jar > packwiz-installer.jar.sha256
      - name: Upload installer snapshot
        if: github.ref == 'refs/heads/main'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: packwiz-installer-snapshot-${{ github.sha }}
          path: |
            apps/packwand-installer/build/dist/packwiz-installer.jar
            apps/packwand-installer/build/dist/packwiz-installer.jar.sha256
