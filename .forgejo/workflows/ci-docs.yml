name: "CI - Docs"

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "apps/packwandrs/**"
      - "justfile"
      - ".forgejo/actions/setup-docs-node/**"
      - ".forgejo/actions/setup-packwand/**"
      - ".forgejo/actions/setup-rust/**"
      - ".forgejo/actions/setup-just/**"
      - ".forgejo/workflows/ci-docs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "apps/packwandrs/**"
      - "justfile"
      - ".forgejo/actions/setup-docs-node/**"
      - ".forgejo/actions/setup-packwand/**"
      - ".forgejo/actions/setup-rust/**"
      - ".forgejo/actions/setup-just/**"
      - ".forgejo/workflows/ci-docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: technocality
    timeout-minutes: 25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/
            /apps/packwandrs/
            /apps/bot/package.json
            /scripts/
            /package.json
            /bun.lock
            /justfile
            /.forgejo/actions/
      - uses: ./.forgejo/actions/setup-packwand
      - uses: ./.forgejo/actions/setup-docs-node
      - uses: ./.forgejo/actions/setup-just
      - name: Type-check docs scripts
        run: just docs-typecheck
      - name: Build docs sites
        run: just docs-build
      - name: Check cross-site doc links
        run: bun docs/link-lint.mts
      - name: Upload docs
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: docs-${{ github.sha }}
          path: |
            docs/docs/.vitepress/dist
            docs/packwand/docs/.vitepress/dist
            docs/packwiz/docs/.vitepress/dist
