name: 'Docs - Packwand Command Reference'

on:
  push:
    branches: ['main']
    paths:
      - 'docs/packwand/**'
      - '.forgejo/actions/setup-packwand/**'
      - '.forgejo/actions/setup-rust/**'
      - '.forgejo/actions/setup-docs-node/**'
      - '.forgejo/workflows/docs-handbook.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'docs/packwand/**'
      - '.forgejo/actions/setup-packwand/**'
      - '.forgejo/actions/setup-rust/**'
      - '.forgejo/actions/setup-docs-node/**'
      - '.forgejo/workflows/docs-handbook.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-reference:
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            docs
            package.json
            bun.lock
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-packwand
      - uses: ./.forgejo/actions/setup-docs-node
      - name: Build Packwand docs and verify command coverage
        working-directory: docs/packwand
        run: bun run docs:build && bun run docs:check-coverage
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: docs-packwand-${{ github.sha }}
          path: docs/packwand/docs/.vitepress/dist
