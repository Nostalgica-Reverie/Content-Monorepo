name: 'Update Nix flake locks'

on:
  workflow_dispatch:

jobs:
  update-lock:
    runs-on: technocality
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          fetch-depth: 1

      - uses: ./.forgejo/actions/setup-nix

      - name: Update root flake.lock
        run: nix flake update

      - name: Commit
        uses: https://github.com/EndBug/add-and-commit@v9
        with:
          author_name: forgejo-actions[bot]
          author_email: omo50@noreply.nostalgica.net
          message: 'chore(nix): update flake locks'
          add: 'flake.lock'
