name: "CI"

# Per-component pipeline: the `changes` job decides which components a push
# actually touched, and every downstream job is gated on that at the job
# level, so components lint/test/build in parallel and untouched components
# skip in seconds. Shared toolchain setup lives in .forgejo/actions/setup-*.

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
      - "installer-v*"
      - "gui-v*"
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/**"
      - "tools/**"
      - "Taskfile.yml"
      - ".forgejo/workflows/ci.yml"
      - ".forgejo/actions/**"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/**"
      - "tools/**"
      - "Taskfile.yml"
      - ".forgejo/workflows/ci.yml"
      - ".forgejo/actions/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: technocality
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      installer: ${{ steps.filter.outputs.installer }}
      docs: ${{ steps.filter.outputs.docs }}
      bot: ${{ steps.filter.outputs.bot }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Determine changed components
        id: filter
        shell: bash
        run: |
          set -eu

          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          fi

          all_changed=false
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no usable base commit to diff against — treating everything as changed"
            all_changed=true
          fi

          out() {
            local key="$1" pattern="$2"
            if [ "$all_changed" = "true" ] || echo "$changed" | grep -qE "$pattern"; then
              echo "$key=true" >> "$GITHUB_OUTPUT"
            else
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          }

          if [ "$all_changed" = "false" ]; then
            changed=$(git diff --name-only "$base" "${{ github.sha }}")
            echo "changed files:"
            echo "$changed"
            # Shared infra files can affect every component, so treat them
            # as touching everything rather than trying to special-case them.
            if echo "$changed" | grep -qE '^(Taskfile\.yml|\.forgejo/workflows/ci\.yml|\.forgejo/actions/)'; then
              all_changed=true
            fi
          fi

          out go '^apps/packwand/'
          out rust '^(apps/mod-browser-webview/|packages/packwand-core/)'
          out installer '^apps/packwand-installer/'
          out docs '^docs/'
          out bot '^apps/bot/'

  # — Lint (one job per component, all parallel) —

  lint-infra:
    # Repo-wide hygiene: spell check (_typos.toml) + workflow lint incl.
    # shellcheck of every run block. Cheap enough to run on every CI trigger.
    needs: [changes]
    runs-on: technocality
    timeout-minutes: 10
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: typos
      - uses: ./.forgejo/actions/setup-go
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: ./.forgejo/actions/setup-task
      - name: Spell check
        run: task lint-typos
      - name: Lint workflows
        run: task lint-actions

  lint-go:
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-go
      - uses: ./.forgejo/actions/setup-task
      - name: Vet Go
        run: task lint-go
      - name: Audit Go dependencies
        run: task audit-go

  lint-rust:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-rust
        with:
          components: clippy, rustfmt
          linux-deps: "true"
          workspaces: |
            apps/mod-browser-webview
            packages/packwand-core
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: ./.forgejo/actions/setup-task
      - name: Lint Rust webview
        run: task lint-webview
      - name: Lint Rust launcher core (packwand-core)
        run: task lint-rust-core
      - name: Audit Rust dependencies
        run: task audit-rust

  lint-installer:
    needs: [changes]
    if: needs.changes.outputs.installer == 'true'
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-java
      - uses: ./.forgejo/actions/setup-task
      - name: Compile-check installer
        run: task lint-installer

  lint-docs:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-docs-node
      - uses: ./.forgejo/actions/setup-task
      - name: Type-check docs scripts
        run: task docs-typecheck

  lint-bot:
    needs: [changes]
    if: needs.changes.outputs.bot == 'true'
    runs-on: technocality
    timeout-minutes: 15
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-bot
      - uses: ./.forgejo/actions/setup-task
      - name: Lint bot (eslint + prettier)
        run: task lint-bot

  # — Test —

  test-go:
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-go
      - uses: ./.forgejo/actions/setup-task
      - name: Go tests
        run: task test-go

  test-rust:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-rust
        with:
          linux-deps: "true"
          workspaces: |
            apps/mod-browser-webview
            packages/packwand-core
      - uses: ./.forgejo/actions/setup-task
      - name: Webview tests
        run: task test-webview
      - name: Rust launcher core tests (packwand-core)
        run: task test-rust-core

  test-installer:
    needs: [changes]
    if: needs.changes.outputs.installer == 'true'
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-java
      - uses: ./.forgejo/actions/setup-task
      - name: Installer tests
        run: task test-installer

  # — Build (per component, gated on that component's lint + test) —

  build-packwand:
    name: "build: packwand (Go)"
    needs: [changes, lint-go, test-go]
    if: needs.changes.outputs.go == 'true'
    runs-on: technocality
    timeout-minutes: 25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-go
      - uses: ./.forgejo/actions/setup-task
      - name: Build
        run: task build-packwand

  build-bootstrap:
    name: "build: packwiz-bootstrap (Go)"
    needs: [changes, lint-go, test-go]
    if: needs.changes.outputs.go == 'true'
    runs-on: technocality
    timeout-minutes: 25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-go
      - uses: ./.forgejo/actions/setup-task
      - name: Build
        run: task build-bootstrap

  build-installer:
    name: "build: packwiz-installer (Kotlin)"
    needs: [changes, lint-installer, test-installer]
    if: needs.changes.outputs.installer == 'true'
    runs-on: technocality
    timeout-minutes: 25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-java
      - uses: ./.forgejo/actions/setup-task
      - name: Build
        run: task build-installer

  build-webview:
    name: "build: mod-browser-webview (Rust)"
    needs: [changes, lint-rust, test-rust]
    if: needs.changes.outputs.rust == 'true'
    runs-on: technocality
    timeout-minutes: 25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-rust
        with:
          linux-deps: "true"
          workspaces: apps/mod-browser-webview
      - uses: ./.forgejo/actions/setup-task
      - name: Build
        run: task build-webview

  build-bot:
    name: "build: discord bot (TypeScript)"
    needs: [changes, lint-bot]
    if: needs.changes.outputs.bot == 'true'
    runs-on: technocality
    timeout-minutes: 15
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.forgejo/actions/setup-bot
      - uses: ./.forgejo/actions/setup-task
      - name: Build
        run: task build-bot

  deploy:
    # Artifact preparation on main: docs sites + GoReleaser snapshot archives +
    # a fresh packwiz-installer jar. Runs even when some component builds were
    # skipped (that's the normal case) — it only bails if something actually
    # failed. Tagged releases publish through packwand-release.yml and
    # release-notes below.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          needs.changes.result == 'success' &&
          needs.build-packwand.result != 'failure' &&
          needs.build-bootstrap.result != 'failure' &&
          needs.build-installer.result != 'failure' &&
          needs.build-webview.result != 'failure' &&
          needs.build-bot.result != 'failure' }}
    needs: [changes, build-packwand, build-bootstrap, build-installer, build-webview, build-bot]
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.forgejo/actions/setup-go
      - uses: ./.forgejo/actions/setup-docs-node
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.go == 'true'
      - uses: ./.forgejo/actions/setup-java
        if: needs.changes.outputs.installer == 'true'
      - uses: ./.forgejo/actions/setup-task

      # — Docs (rebuilt whenever docs/ changes, or packwand's own source does
      #   since the CLI reference pages are generated from it) —
      - name: Build docs sites
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.go == 'true'
        run: task docs-build
      - name: Check packwand CLI-reference coverage
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.go == 'true'
        working-directory: docs/packwand
        run: npm run docs:check-coverage
      - name: Check cross-site doc links
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.go == 'true'
        run: node docs/link-lint.mts
      - name: Upload docs
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.go == 'true'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: docs-${{ github.sha }}
          path: |
            docs/docs/.vitepress/dist
            docs/packwand/docs/.vitepress/dist
            docs/packwiz/docs/.vitepress/dist

      # — packwand: continuous "latest" binaries, downloadable from this run
      #   without needing a tagged release —
      - name: Install Syft for snapshot SBOMs
        if: needs.changes.outputs.go == 'true'
        run: |
          go install github.com/anchore/syft/cmd/syft@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: GoReleaser snapshot
        if: needs.changes.outputs.go == 'true'
        uses: https://github.com/goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
          workdir: apps/packwand
      - name: Upload packwand snapshot
        if: needs.changes.outputs.go == 'true'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: packwand-snapshot-${{ github.sha }}
          path: |
            apps/packwand/dist/*.tar.gz
            apps/packwand/dist/*.zip
            apps/packwand/dist/checksums.txt
          compression-level: 0

      # — packwiz-installer: same idea, continuous downloadable jar. The
      #   .sha256 sibling lets packwiz-bootstrap auto-verify its download. —
      - name: Build packwiz-installer jar
        if: needs.changes.outputs.installer == 'true'
        run: task build-installer
      - name: Checksum packwiz-installer jar
        if: needs.changes.outputs.installer == 'true'
        working-directory: apps/packwand-installer/build/dist
        run: sha256sum packwiz-installer.jar > packwiz-installer.jar.sha256
      - name: Upload packwiz-installer snapshot
        if: needs.changes.outputs.installer == 'true'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: packwiz-installer-snapshot-${{ github.sha }}
          path: |
            apps/packwand-installer/build/dist/packwiz-installer.jar
            apps/packwand-installer/build/dist/packwiz-installer.jar.sha256

  release-notes:
    # On component tags: generate the component's changelog with git-chglog
    # (.chglog/<component>/config.yml) and attach it to the Forgejo release.
    # packwand binaries themselves are attached by packwand-release.yml.
    # Tag pushes have no diffable base, so `changes` marks every component
    # changed and all builds above will have run.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-packwand, build-bootstrap, build-installer, build-webview, build-bot]
    runs-on: technocality
    timeout-minutes: 10
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.forgejo/actions/setup-go
      - name: Generate component changelog
        run: |
          set -eu
          go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            installer-v*) COMPONENT=installer ;;
            gui-v*)       COMPONENT=gui ;;
            v*)           COMPONENT=packwand ;;
            *) echo "unrecognised tag $TAG"; exit 1 ;;
          esac
          echo "component: $COMPONENT"
          "$(go env GOPATH)/bin/git-chglog" --config ".chglog/$COMPONENT/config.yml" --output release-notes.md "$TAG"
          cat release-notes.md
          mkdir -p release-assets
      - name: Create/update Forgejo release with notes
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          tag: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: release-assets
          release-notes: release-notes.md
