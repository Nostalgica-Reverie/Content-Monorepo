name: "Build"

on:
  push:
    branches: ["main"]
    paths:
      - 'modpacks/**'
      - 'datapacks/**'
      - 'resourcepacks/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'modpacks/**'
      - 'datapacks/**'
      - 'resourcepacks/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: technocality
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            modpacks
            datapacks
            resourcepacks
            src/actions/somnus
            tools/manifest
            .forgejo/actions

      - name: Meta
        id: meta
        run: |
          set -eu
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          echo "$CHANGED" | grep -q '^modpacks/'  && echo "has_modpacks=true"  >> $GITHUB_OUTPUT || echo "has_modpacks=false"  >> $GITHUB_OUTPUT

      - name: Set up Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Packwiz
        if: steps.meta.outputs.has_modpacks == 'true' && steps.cache-go.outputs.cache-hit != 'true'
        run: go install github.com/packwiz/packwiz@latest

      - name: Setup Go
        uses: https://github.com/actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          
      - name: Setup Somnus
        uses: ./.forgejo/actions/setup-somnus
        with:
          install-packwiz: ${{ steps.meta.outputs.has_modpacks }}

      - name: Lint changed files (syntax)
        run: ./somnus-bin/somnus lint

      - name: Validate changed pack manifests
        run: |
          set -eu
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          CHANGED_PACKS=$(echo "$CHANGED" | grep -E '^(modpacks|datapacks|resourcepacks)/[^/]+/' | cut -d/ -f1-2 | sort -u || true)
          if [ -z "$CHANGED_PACKS" ]; then
            echo "no pack manifests to validate."
            exit 0
          fi
          STATUS=0
          while IFS= read -r pack; do
            [ -n "$pack" ] || continue
            for mf in "$pack/manifest.json" "$pack/manifest-experimental.json"; do
              if [ -f "$mf" ]; then
                echo "validating $mf"
                bun tools/manifest/validate.ts "$mf" || STATUS=1
              fi
            done
          done <<< "$CHANGED_PACKS"
          exit $STATUS

      - name: Run Build
        run: ./somnus-bin/somnus build "${{ steps.meta.outputs.short_sha }}"

      - name: Upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: "build-${{ steps.meta.outputs.short_sha }}"
          path: "artifacts/"
          compression-level: 0