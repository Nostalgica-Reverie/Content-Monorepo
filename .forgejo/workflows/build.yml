name: "Build"

on:
  push:
    branches: ["main"]
    paths:
      - 'modpacks/**'
      - 'datapacks/**'
      - 'resourcepacks/**'
      - 'src/actions/builder/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'modpacks/**'
      - 'datapacks/**'
      - 'resourcepacks/**'
      - 'src/actions/builder/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: technocality
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            modpacks
            datapacks
            resourcepacks
            src/actions/builder

      - name: Meta
        id: meta
        run: |
          set -eu
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          echo "$CHANGED" | grep -q '^modpacks/'  && echo "has_modpacks=true"  >> $GITHUB_OUTPUT || echo "has_modpacks=false"  >> $GITHUB_OUTPUT

      - name: Cache Builder Binary
        id: cache-builder
        uses: actions/cache@v4
        with:
          path: ./builder-bin
          key: builder-go-v1-${{ runner.os }}-${{ hashFiles('src/actions/builder/**/*.go', 'src/actions/builder/go.mod') }}

      - name: Setup Go
        if: steps.cache-builder.outputs.cache-hit != 'true'
        uses: https://github.com/actions/setup-go@v5
        with: { go-version: 'stable', cache: true }

      - name: Build Binary
        if: steps.cache-builder.outputs.cache-hit != 'true'
        run: |
          go build -C src/actions/builder -o "$GITHUB_WORKSPACE/builder-bin/builder" .
          chmod +x ./builder-bin/builder

      - name: Cache Packwiz
        if: steps.meta.outputs.has_modpacks == 'true'
        id: cache-go
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-bin-packwiz-v1-${{ runner.os }}

      - name: Setup Go Dos
        if: steps.meta.outputs.has_modpacks == 'true' && steps.cache-go.outputs.cache-hit != 'true' && steps.cache-builder.outputs.cache-hit == 'true'
        uses: https://github.com/actions/setup-go@v5
        with: { go-version: 'stable', cache: true }

      - name: Install Packwiz
        if: steps.meta.outputs.has_modpacks == 'true' && steps.cache-go.outputs.cache-hit != 'true'
        run: go install github.com/packwiz/packwiz@latest

      - name: Add Go bin to PATH
        if: steps.meta.outputs.has_modpacks == 'true'
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run Build
        run: ./builder-bin/builder "${{ steps.meta.outputs.short_sha }}"

      - name: Upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: "build-${{ steps.meta.outputs.short_sha }}"
          path: "artifacts/"
          compression-level: 0
