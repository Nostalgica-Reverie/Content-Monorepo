name: "Build"

on:
  push:
    branches: ["main"]
    paths:
      - 'modpacks/**'
      - 'datapacks/**'
      - 'src/actions/builder/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'modpacks/**'
      - 'datapacks/**'
      - 'src/actions/builder/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: technocality
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            modpacks
            datapacks
            src/actions/builder

      - name: Meta
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Cache Builder Binaries
        id: cache-builder
        uses: actions/cache@v4
        with:
          path: ./builder-bin
          key: builder-v2-${{ runner.os }}-${{ hashFiles('src/actions/builder/**/*.rs', 'src/actions/builder/Cargo.toml', 'src/actions/builder/Cargo.lock') }}

      - name: Install Rust
        if: steps.cache-builder.outputs.cache-hit != 'true'
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Rust Cache
        if: steps.cache-builder.outputs.cache-hit != 'true'
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: "src/actions/builder -> target"

      - name: Build Binaries
        if: steps.cache-builder.outputs.cache-hit != 'true'
        run: |
          cargo build --release \
            --manifest-path src/actions/builder/Cargo.toml \
            --bin builder --bin minify-json
          mkdir -p ./builder-bin
          cp src/actions/builder/target/release/builder ./builder-bin/builder
          cp src/actions/builder/target/release/minify-json ./builder-bin/minify-json

      - name: Cache Go Binaries
        id: cache-go
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-bin-packwiz-v1-${{ runner.os }}

      - name: Setup Go
        if: steps.cache-go.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Packwiz
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: go install github.com/packwiz/packwiz@latest

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Cache Packwiz Downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/packwiz
          key: packwiz-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            packwiz-cache-${{ runner.os }}-

      - name: Minify JSON configs
        run: |
          set -eu
          chmod +x ./builder-bin/minify-json

          if [ -d datapacks ]; then
            for pack_dir in datapacks/*/; do
              [ -d "$pack_dir" ] || continue
              TARGET="${pack_dir}content"
              if [ -d "$TARGET" ]; then
                cp -r "$TARGET" "${TARGET}.original"
                ./builder-bin/minify-json "$TARGET"
              fi
            done
          fi

          if [ -d modpacks ]; then
            for pack_dir in modpacks/*/; do
              [ -d "$pack_dir" ] || continue
              for subdir in "$pack_dir"*-mr "$pack_dir"*-cf; do
                [ -d "$subdir" ] || continue
                CONFIG_DIR="$subdir/config"
                if [ -d "$CONFIG_DIR" ]; then
                  cp -r "$CONFIG_DIR" "${CONFIG_DIR}.original"
                  ./builder-bin/minify-json "$CONFIG_DIR"
                fi
              done
            done
          fi

      - name: Run Build
        run: |
          chmod +x ./builder-bin/builder
          ./builder-bin/builder "${{ steps.meta.outputs.short_sha }}"

      - name: Restore JSON sources
        if: always()
        run: |
          set -eu

          if [ -d datapacks ]; then
            for pack_dir in datapacks/*/; do
              [ -d "$pack_dir" ] || continue
              TARGET="${pack_dir}content"
              if [ -d "${TARGET}.original" ]; then
                rm -rf "$TARGET"
                mv "${TARGET}.original" "$TARGET"
              fi
            done
          fi

          if [ -d modpacks ]; then
            for pack_dir in modpacks/*/; do
              [ -d "$pack_dir" ] || continue
              for subdir in "$pack_dir"*-mr "$pack_dir"*-cf; do
                [ -d "$subdir" ] || continue
                CONFIG_DIR="$subdir/config"
                if [ -d "${CONFIG_DIR}.original" ]; then
                  rm -rf "$CONFIG_DIR"
                  mv "${CONFIG_DIR}.original" "$CONFIG_DIR"
                fi
              done
            done
          fi

      - name: Upload
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: "build-${{ steps.meta.outputs.short_sha }}"
          path: "artifacts/"
