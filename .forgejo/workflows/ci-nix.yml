name: "CI - Nix"

on:
  push:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "apps/api/**"
      - "apps/packwandrs/**"
      - "packages/packwand2nix/**"
      - "modpacks/**/checksums.json"
      - "justfile"
      - ".forgejo/actions/setup-nix/**"
      - ".forgejo/actions/setup-just/**"
      - ".forgejo/workflows/ci-nix.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "apps/api/**"
      - "apps/packwandrs/**"
      - "packages/packwand2nix/**"
      - "modpacks/**/checksums.json"
      - "justfile"
      - ".forgejo/actions/setup-nix/**"
      - ".forgejo/actions/setup-just/**"
      - ".forgejo/workflows/ci-nix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: technocality
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/api
            apps/packwandrs
            modpacks
            packages/packwand2nix
            flake.nix
            flake.lock
            justfile
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-nix
      - uses: ./.forgejo/actions/setup-just
      - name: Evaluate Nix outputs
        run: just lint-nix
      - name: Run Nix checks
        run: just test-nix
      - name: Build Nix packages
        run: just build-nix
