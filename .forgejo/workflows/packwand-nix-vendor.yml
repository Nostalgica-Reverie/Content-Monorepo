name: "Update API Go Nix Vendor Hash"

on:
  push:
    branches: ["main"]
    paths:
      - 'apps/api/go.mod'
      - 'apps/api/go.sum'
  workflow_dispatch:

jobs:
  update-vendor-hash:
    runs-on: technocality
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          fetch-depth: 1

      - uses: ./.forgejo/actions/setup-nix

      - name: Update vendor hashes
        run: |
          set -eu
          for component in api; do
            (
              cd "apps/$component"
              nix run nixpkgs#nix-prefetch ./nix/prefetcher.nix | tee ./nix/vendor-hash
            )
          done

      - name: Commit
        uses: https://github.com/EndBug/add-and-commit@v9
        with:
          author_name: forgejo-actions[bot]
          author_email: omo50@noreply.nostalgica.net
          message: 'chore(nix): update Go vendor hashes'
          add: 'apps/api/nix/vendor-hash'
