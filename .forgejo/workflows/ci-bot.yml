name: 'CI - Bot'

on:
  push:
    branches: ['main']
    paths:
      - 'apps/bot/**'
      - 'package.json'
      - 'bun.lock'
      - '.forgejo/actions/setup-bot/**'
      - '.forgejo/actions/setup-just/**'
      - 'justfile'
      - '.forgejo/workflows/ci-bot.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'apps/bot/**'
      - 'package.json'
      - 'bun.lock'
      - '.forgejo/actions/setup-bot/**'
      - '.forgejo/actions/setup-just/**'
      - 'justfile'
      - '.forgejo/workflows/ci-bot.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot:
    runs-on: technocality
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/bot/
            /scripts/
            /package.json
            /bun.lock
            /justfile
            /.forgejo/actions/
            /docs/package.json
            /docs/modpack-dev-handbook/package.json
            /docs/packwand/package.json
            /docs/packwiz/package.json
      - uses: ./.forgejo/actions/setup-bot
      - uses: ./.forgejo/actions/setup-just
      - name: Lint bot
        run: just lint-bot
      - name: Build bot
        run: just build-bot
