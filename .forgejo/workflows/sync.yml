name: "Sync"

on:
  workflow_dispatch:
  push:
    paths:
      - 'modpacks/simply-optimized-forked/**'
      - 'modpacks/rekindled-common/**'
      - 'modpacks/lce-common/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    uses: ./.forgejo/workflows/somnus-task.yml
    with:
      verb: sync
      commit-message: 'actions: sync'