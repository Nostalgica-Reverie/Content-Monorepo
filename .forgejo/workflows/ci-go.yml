name: 'CI - Packwand CLI'

on:
  push:
    branches: ['main']
    paths:
      - 'apps/packwandrs/**'
      - '.forgejo/actions/setup-packwand/**'
      - '.forgejo/actions/setup-rust/**'
      - '.forgejo/workflows/ci-go.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'apps/packwandrs/**'
      - '.forgejo/actions/setup-packwand/**'
      - '.forgejo/actions/setup-rust/**'
      - '.forgejo/workflows/ci-go.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: technocality
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/packwandrs
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-packwand
      - name: Smoke-test Packwand CLI
        run: packwand version
      - name: Upload Packwand snapshot
        if: github.ref == 'refs/heads/main'
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: packwand-linux-x86_64-${{ github.sha }}
          path: apps/packwandrs/target/release/packwand
          compression-level: 0
