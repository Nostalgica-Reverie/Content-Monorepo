name: 'Packwand GUI Release'

on:
  push:
    tags: ['gui-v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: technocality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: windows
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.forgejo/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          linux-deps: 'true'
          extra-packages: nsis
          cache-key: gui-${{ matrix.name }}
          workspaces: apps/packwandrs
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: ./.forgejo/actions/setup-java
        with:
          java-version: '25'
      - uses: ./.forgejo/actions/setup-just
      - name: Install build dependencies
        run: |
          bun install --cwd apps/packwandrs --frozen-lockfile
          cargo install --locked tauri-cli --version "^2"
      - name: Build bundled installer resource
        run: just build-installer
      - name: Build Linux CLI resource
        if: matrix.name == 'linux'
        working-directory: apps/packwandrs
        run: |
          cargo build --locked --release -p packwand-cli
          cp target/release/packwand target/release/packwand.exe
      - name: Build Windows CLI resource
        if: matrix.name == 'windows'
        working-directory: apps/packwandrs
        run: |
          cargo install --locked cargo-xwin
          cargo xwin build --locked --release -p packwand-cli --target x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/packwand.exe target/release/packwand.exe
      - name: Build Linux desktop bundles
        if: matrix.name == 'linux'
        working-directory: apps/packwandrs
        run: cargo tauri build --bundles "${{ matrix.bundles }}"
      - name: Build Windows desktop bundle
        if: matrix.name == 'windows'
        working-directory: apps/packwandrs
        run: cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles "${{ matrix.bundles }}"
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find apps/packwandrs/target -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*-setup.exe" \) -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: packwand-gui-${{ matrix.name }}
          path: release-assets/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/gui-v')
    runs-on: technocality
    permissions:
      contents: write
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: release-assets
          pattern: packwand-gui-*
          merge-multiple: true
      - uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          tag: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: release-assets
