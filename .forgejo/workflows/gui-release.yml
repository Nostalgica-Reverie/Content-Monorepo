name: "Packwand GUI Release"

# Builds and publishes the Tauri desktop app. Changelog notes for gui-v*
# tags are already generated by ci.yml's `release-notes` job (git-chglog
# against .chglog/gui/config.yml) — this workflow only builds the bundles
# and attaches them as release assets, mirroring how packwand-release.yml
# stands alone for the CLI's v* binaries.
#
# Targets: Linux (native) and Windows (cross-compiled via cargo-xwin, per
# Tauri's own documented cross-compilation guide) from the same Linux
# runner — no macOS/Windows runner infrastructure exists yet, so macOS is
# deliberately not built here. Both bundles are unsigned for now: Tauri
# doesn't handle Windows cross-compile signing out of the box, and macOS
# signing/notarization needs real Apple hardware regardless.

on:
  push:
    tags:
      - "gui-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: technocality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            rust_target: x86_64-unknown-linux-gnu
          - name: windows
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: src/packwand/go.sum

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/packwand/rs
            src/packwand/gui/tauri/src-tauri
          key: ${{ matrix.name }}

      - name: Install Linux/Tauri bundler dependencies (also needed for the Windows NSIS bundler step)
        run: |
          apt-get update
          apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev nsis

      - name: Install cargo-xwin (Windows cross-compile only)
        if: matrix.name == 'windows'
        run: cargo install --locked cargo-xwin

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Tauri CLI
        run: cargo install --locked tauri-cli --version "^2"

      - name: Build the packwand CLI sidecar
        run: $(go env GOPATH)/bin/task build-gui-sidecar

      - name: Build Tauri app (Linux, native)
        if: matrix.name == 'linux'
        working-directory: src/packwand/gui/tauri
        run: cargo tauri build

      - name: Build Tauri app (Windows, cross-compiled via cargo-xwin)
        if: matrix.name == 'windows'
        working-directory: src/packwand/gui/tauri
        run: cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc

      - name: Collect bundle
        run: |
          set -eu
          mkdir -p release-assets
          case "${{ matrix.name }}" in
            linux)
              find src/packwand/gui/tauri/src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release-assets/ \;
              ;;
            windows)
              find src/packwand/gui/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -type f -name "*-setup.exe" -exec cp {} release-assets/ \;
              ;;
          esac
          ls -la release-assets

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: packwand-gui-${{ matrix.name }}
          path: release-assets/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/gui-v')
    runs-on: technocality
    permissions:
      contents: write
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: release-assets
          pattern: packwand-gui-*
          merge-multiple: true

      - name: Attach GUI bundles to the release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          tag: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}
          release-dir: release-assets
