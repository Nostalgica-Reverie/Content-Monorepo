name: 'CI - Rust'

on:
  push:
    branches: ['main']
    paths:
      - 'apps/mod-browser-webview/**'
      - 'apps/packwandrs/**'
      - 'justfile'
      - '.forgejo/actions/setup-rust/**'
      - '.forgejo/actions/setup-just/**'
      - '.forgejo/workflows/ci-rust.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'apps/mod-browser-webview/**'
      - 'apps/packwandrs/**'
      - 'justfile'
      - '.forgejo/actions/setup-rust/**'
      - '.forgejo/actions/setup-just/**'
      - '.forgejo/workflows/ci-rust.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: technocality
    timeout-minutes: 30
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            apps/mod-browser-webview
            apps/packwandrs
            scripts
            justfile
            .forgejo/actions
      - uses: ./.forgejo/actions/setup-rust
        with:
          components: clippy, rustfmt
          linux-deps: 'true'
          workspaces: |
            apps/mod-browser-webview
            apps/packwandrs
      - uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: ./.forgejo/actions/setup-just
      - name: Lint Rust webview
        run: just lint-webview
      - name: Lint Packwand core
        run: just lint-rust-core
      - name: Audit Rust dependencies
        run: just audit-rust
      - name: Test Rust webview
        run: just test-webview
      - name: Test Packwand core
        run: just test-rust-core
      - name: Build Rust webview
        run: just build-webview
