when:
  - event: ['push']
    branch: ['main']
    paths:
      [
        'modpacks/simply-optimized-forked/**/manifest.json',
        'modpacks/rekindled-common/**/manifest.json',
        'modpacks/lce-common/**/manifest.json',
      ]
  - event: ['manual']

engine: microvm
image: nixos
dependencies: [cmake, gcc, git, gnumake, ninja, openssh, pkg-config, rustup]
steps:
  - name: Build Packwand CLI
    command: cd apps/packwandrs && cargo build --locked --release -p packwand-cli
  - name: Synchronize packs and commit
    command: |
      apps/packwandrs/target/release/packwand batch sync
      TANGLED_COMMIT_MESSAGE='actions: sync' sh scripts/tangled/commit-and-push.sh modpacks
