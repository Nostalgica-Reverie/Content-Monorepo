when:
  - event: ['manual']

engine: microvm
image: nixos
dependencies: [cmake, gcc, git, gnumake, ninja, openssh, pkg-config, rustup]
steps:
  - name: Build Packwand CLI
    command: cd apps/packwandrs && cargo build --locked --release -p packwand-cli
  - name: Update all packs and commit
    command: |
      apps/packwandrs/target/release/packwand batch update
      TANGLED_COMMIT_MESSAGE='actions: bulk update' sh scripts/tangled/commit-and-push.sh modpacks
