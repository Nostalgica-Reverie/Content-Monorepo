when:
  - event: ["push"]
    branch: ["main"]
    paths: ["apps/mod-browser-webview/**", "apps/packwandrs/**", "justfile"]
  - event: ["pull_request"]
    branch: ["main"]
    paths: ["apps/mod-browser-webview/**", "apps/packwandrs/**", "justfile"]
  - event: ["manual"]

engine: microvm
image: nixos
dependencies: [cargo-audit, cmake, gcc, git, gnumake, just, ninja, pkg-config, rustup, webkitgtk_4_1]

steps:
  - name: Lint Rust webview
    command: just lint-webview
  - name: Lint Packwand core
    command: just lint-rust-core
  - name: Audit Rust dependencies
    command: just audit-rust
  - name: Test Rust webview
    command: just test-webview
  - name: Test Packwand core
    command: just test-rust-core
  - name: Build Rust webview
    command: just build-webview
