when:
  - event: ["push"]
    branch: ["main"]
    paths: ["modpacks/**/manifest.json", "datapacks/**/manifest.json", "resourcepacks/**/manifest.json", "mods/**/manifest.json"]
  - event: ["manual"]

engine: microvm
image: nixos
clone:
  depth: 5
dependencies: [bun, cmake, gcc, git, gnumake, jdk25, jq, ninja, pkg-config, rustup]

steps:
  - name: Build Packwand CLI
    command: cd apps/packwandrs && cargo build --locked --release -p packwand-cli
  - name: Publish planned content sequentially
    command: |
      set -eo pipefail
      packwand=apps/packwandrs/target/release/packwand
      "$packwand" publish plan > plan.json
      jq -ce '.[]' plan.json | while IFS= read -r entry; do
        manifest=$(jq -r .manifest <<<"$entry")
        variant=$(jq -r '.variant // empty' <<<"$entry")
        dir=$(dirname "$manifest")
        "$packwand" preflight "$dir"
        "$packwand" json minify "$dir"
        bun scripts/run.ts generate-changelog "$manifest" release-notes.md
        "$packwand" publish build "$manifest" ${variant:+"$variant"}
        "$packwand" publish upload --live --changelog-file release-notes.md "$manifest" ${variant:+"$variant"}
        "$packwand" publish verify "$manifest" ${variant:+"$variant"}
      done
  - name: Verify Nix publish surface
    command: |
      nix flake check --no-build --no-update-lock-file
      nix flake check --no-update-lock-file --print-build-logs
