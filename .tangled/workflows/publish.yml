when:
  - event: ["push"]
    branch: ["main"]
    paths: ["modpacks/**/manifest.json", "datapacks/**/manifest.json", "resourcepacks/**/manifest.json", "mods/**/manifest.json"]
  - event: ["manual"]

engine: microvm
image: nixos
clone:
  depth: 5
dependencies: [bun, cmake, gcc, git, gnumake, jdk25, jq, ninja, pkg-config, rustup]

steps:
  - name: Build Packwand CLI
    command: cd apps/packwandrs && cargo build --locked --release -p packwand-cli
  - name: Publish planned content sequentially
    command: |
      set -eo pipefail
      packwand=apps/packwandrs/target/release/packwand
      # generate-changelog.ts invokes Packwand through PACKWAND_BIN. Keep it
      # pointed at this job's freshly built binary instead of relying on PATH.
      export PACKWAND_BIN="$packwand"
      # Tangled exposes the repository credentials under the short names used
      # by the existing Forgejo setup. Packwand uses descriptive environment
      # names internally.
      export MODRINTH_TOKEN="${MR:?MR secret is required}"
      export CURSEFORGE_TOKEN="${CF:?CF secret is required}"
      export CURSEFORGE_API_KEY="${CURSEFORGE_API_KEY:-$CF}"
      # Pack indexes are generated artifacts and are intentionally gitignored;
      # a clean CI checkout must refresh them before preflight/publish.
      "$packwand" batch refresh
      "$packwand" publish plan > plan.json
      failed=0
      while IFS= read -r entry; do
        manifest=$(jq -r .manifest <<<"$entry")
        variant=$(jq -r '.variant // empty' <<<"$entry")
        dir=$(dirname "$manifest")
        if "$packwand" preflight "$dir" &&
          "$packwand" json minify "$dir" &&
          bun scripts/run.ts generate-changelog "$manifest" release-notes.md &&
          "$packwand" publish build "$manifest" ${variant:+"$variant"} &&
          "$packwand" publish upload --live --changelog-file release-notes.md "$manifest" ${variant:+"$variant"} &&
          "$packwand" publish verify "$manifest" ${variant:+"$variant"}; then
          echo "published $manifest ${variant:+($variant)}"
        else
          echo "publish failed for $manifest ${variant:+($variant)}" >&2
          failed=1
        fi
      done < <(jq -ce '.[]' plan.json)
      exit "$failed"
  - name: Verify Nix publish surface
    command: |
      nix flake check --no-build --no-update-lock-file
      nix flake check --no-update-lock-file --print-build-logs
