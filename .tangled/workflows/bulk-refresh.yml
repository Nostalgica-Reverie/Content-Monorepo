when:
  - event: ["manual"]

engine: microvm
image: nixos
dependencies: [cargo, gcc, git, openssh, rustc]
steps:
  - name: Build Packwand CLI
    command: cd apps/packwandrs && cargo build --locked --release -p packwand-cli
  - name: Refresh all packs and commit
    command: |
      apps/packwandrs/target/release/packwand batch refresh
      TANGLED_COMMIT_MESSAGE='actions: bulk refresh' sh scripts/tangled/commit-and-push.sh modpacks
