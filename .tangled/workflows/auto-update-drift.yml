when:
  - event: ['manual']

engine: microvm
image: nixos
dependencies: [cmake, gcc, git, gnumake, jq, ninja, pkg-config, rustup]
steps:
  - name: Build Packwand CLI
    command: cd apps/packwandrs && cargo build --locked --release -p packwand-cli
  - name: Report update drift and variant parity
    command: |
      set -eo pipefail
      packwand=apps/packwandrs/target/release/packwand
      "$packwand" batch update --check --json --ignored-only | jq .
      "$packwand" parity --json | jq .
