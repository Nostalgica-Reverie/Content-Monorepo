when:
  - event: ['manual']

engine: microvm
image: nixos
dependencies: [cmake, gcc, git, gnumake, jq, ninja, pkg-config, rustup]
steps:
  - name: Build Packwand CLI
    command: |
      git clone --depth 1 https://tangled.org/nostalgica.net/bundle bundle-src
      cd bundle-src && cargo build --locked --release -p bundle-cli --bin packwand
  - name: Report update drift and variant parity
    command: |
      set -eo pipefail
      packwand=bundle-src/target/release/packwand
      "$packwand" batch update --check --json --ignored-only | jq .
      "$packwand" parity --json | jq .
