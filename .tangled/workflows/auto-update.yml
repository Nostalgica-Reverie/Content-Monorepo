when:
  - event: ["manual"]

engine: microvm
image: nixos
dependencies: [cargo, gcc, git, openssh, rustc]
steps:
  - name: Build Packwand CLI
    command: cd apps/packwandrs && cargo build --locked --release -p packwand-cli
  - name: Update opted-in packs and commit
    command: |
      apps/packwandrs/target/release/packwand batch update
      TANGLED_COMMIT_MESSAGE='actions: auto-update' sh scripts/tangled/commit-and-push.sh modpacks
