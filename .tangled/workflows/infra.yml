when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos
dependencies: [actionlint, just, typos]

steps:
  - name: Spell check
    command: just lint-typos
  - name: Lint retained Forgejo workflows
    command: just lint-actions
