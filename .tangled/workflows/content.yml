# Validation equivalent of Forgejo's build gate. Publishing/build artifacts remain
# on Forgejo because Spindle has no artifact upload and this build needs a secret.
when:
  - event: ['push']
    branch: ['main']
    paths: ['modpacks/**', 'datapacks/**', 'resourcepacks/**']
  - event: ['pull_request']
    branch: ['main']
    paths: ['modpacks/**', 'datapacks/**', 'resourcepacks/**']
  - event: ['manual']

engine: microvm
image: nixos
dependencies: [cmake, gcc, git, gnumake, ninja, pkg-config, rustup]

steps:
  - name: Build Packwand CLI
    command: |
      git clone --depth 1 https://tangled.org/nostalgica.net/bundle bundle-src
      cd bundle-src && cargo build --locked --release -p bundle-cli --bin packwand
  - name: Lint content syntax
    command: bundle-src/target/release/packwand lint
  - name: Preflight changed pack manifests
    command: |
      set -e
      changed="$(git diff-tree --no-commit-id --name-only -r HEAD || true)"
      packs="$(printf '%s\n' "$changed" | grep -E '^(modpacks|datapacks|resourcepacks)/[^/]+/' | cut -d/ -f1-2 | sort -u || true)"
      test -z "$packs" && exit 0
      printf '%s\n' "$packs" | while IFS= read -r pack; do
        bundle-src/target/release/packwand preflight "$pack"
      done
