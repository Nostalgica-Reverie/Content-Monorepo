when:
  - event: ["manual"]

engine: microvm
image: nixos
dependencies: [cargo, clippy, rustc, rustfmt]

steps:
  - name: Format
    command: cargo fmt --package packeater_cli -- --check
    environment:
      CARGO_MANIFEST_PATH: apps/packwandrs/Cargo.toml
  - name: Lint
    command: cargo clippy -p packeater_cli --all-targets -- -D warnings
    environment:
      CARGO_MANIFEST_PATH: apps/packwandrs/Cargo.toml
  - name: Test
    command: cargo test -p packeater_cli
    environment:
      CARGO_MANIFEST_PATH: apps/packwandrs/Cargo.toml
  - name: Build
    command: cargo build --release -p packeater_cli
    environment:
      CARGO_MANIFEST_PATH: apps/packwandrs/Cargo.toml
