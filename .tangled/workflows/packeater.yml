when:
  - event: ['manual']

engine: microvm
image: nixos
dependencies: [cmake, gcc, git, gnumake, ninja, pkg-config, rustup]

steps:
  - name: Format
    command: cd apps/packwandrs && cargo fmt --package packeater_cli -- --check
  - name: Lint
    command: cd apps/packwandrs && cargo clippy -p packeater_cli --all-targets -- -D warnings
  - name: Test
    command: cd apps/packwandrs && cargo test -p packeater_cli
  - name: Build
    command: cd apps/packwandrs && cargo build --release -p packeater_cli
