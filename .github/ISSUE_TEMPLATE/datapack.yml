name: Datapack Bug Report
description: File a bug report for one of our datapacks.
title: "[Datapack]: "
labels:
  - bug
  - datapack
body:
  - type: input
    id: issue
    attributes:
      label: What is the issue?
      description: Please describe what the issue is.
      placeholder: "ex. Legacy Nether does not generate when [...]"
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: To Reproduce
      description: Please describe what steps to take to recreate the issue.
      placeholder: |
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: datapack
    attributes:
      label: Datapack
      description: What datapack are you using?
      options:
        - Legacy Nether
        - Legacy Nether Extended
        - Legacy Mechanics
      default: 0
    validations:
      required: true
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft Version
      description: What version of Minecraft are you running?
      options:
        - 26.1.2
        - 1.21.11
        - 1.21.10
        - 1.21.8
        - 1.21.5
        - 1.21.4
        - 1.21.3
        - 1.21.1
        - 1.20.4
        - 1.20.1
      default: 0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where is the datapack installed?
      options:
        - Singleplayer world
        - Multiplayer server
      default: 0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log and crash report
      description: If the game logged anything relevant, upload it to mclo.gs and paste the link here. Write "N/A" if nothing was logged.
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Additional Context
      description: Put any extra info you feel is necessary here.
  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgement
      description: If you do not fill out this form correctly, your issue will be immediately closed.
      options:
        - label: I understand and have fully filled out the form, including the issue name.
          required: true