name: Resource Pack Bug Report
description: File a bug report for one of our resource packs.
title: '[Resource Pack]: '
labels:
  - bug
  - resourcepack
body:
  - type: input
    id: issue
    attributes:
      label: What is the issue?
      description: Please describe what the issue is.
      placeholder: 'ex. Texture renders incorrectly when [...]'
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: To Reproduce
      description: Please describe what steps to take to recreate the issue.
      placeholder: |
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: input
    id: resourcepack
    attributes:
      label: Resource Pack
      description: Which resource pack (and version) are you using?
    validations:
      required: true
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft Version
      description: What version of Minecraft are you running?
      options:
        - 26.1.2
        - 1.21.11
        - 1.21.10
        - 1.21.8
        - 1.21.5
        - 1.21.4
        - 1.21.3
        - 1.21.1
        - 1.20.4
        - 1.20.1
      default: 0
    validations:
      required: true
  - type: input
    id: other-packs
    attributes:
      label: Other resource packs active
      description: List any other resource packs enabled at the same time, in order. Write "none" if N/A
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: A picture of the visual issue is incredibly useful
  - type: textarea
    id: extras
    attributes:
      label: Additional Context
      description: Put any extra info you feel is necessary here.
  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgement
      description: If you do not fill out this form correctly, your issue will be immediately closed.
      options:
        - label: I understand and have fully filled out the form, including the issue name.
          required: true
