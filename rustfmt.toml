# Repo-wide rustfmt config — rustfmt searches parent directories, so this one
# file governs all Rust trees (apps/packwandrs, apps/mod-browser-webview,
# apps/packwand/gui/tauri/src-tauri).
edition = "2024"
# Never emit CRLF, even when files were checked out or created on Windows.
newline_style = "Unix"
# Tabs, per markdowns/newstandards.md. Not rustfmt's default and not the wider
# Rust community's convention, but this repo indents with tabs across every
# language that can, and one rule everywhere beats one rule per ecosystem.
hard_tabs = true
