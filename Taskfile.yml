version: "3"

# Monorepo build tasks. Install Task from https://taskfile.dev (or `go install
# github.com/go-task/task/v3/cmd/task@latest`), then run e.g. `task build-installer`.
# CI (.forgejo/workflows/ci.yml) drives these same tasks, so local runs match the
# build server exactly.

vars:
  INSTALLER_DIR: apps/packwand-installer
  WEBVIEW_DIR: apps/mod-browser-webview
  GUI_TAURI_DIR: apps/packwand/gui/tauri
  RS_DIR: packages/packwand-core
  BOT_DIR: apps/bot
  API_DIR: apps/api
  DOCS_SITES: docs docs/packwand docs/packwiz

tasks:
  # — Shared helpers (the "defaults": component tasks call these instead of
  #   re-encoding platform quirks) —

  gradlew:
    desc: Run ./gradlew in the installer dir with GRADLE_ARGS, handling the Windows/Unix wrapper split
    internal: true
    dir: "{{.INSTALLER_DIR}}"
    requires:
      vars: [GRADLE_ARGS]
    cmds:
      - cmd: sh ./gradlew {{.GRADLE_ARGS}} --no-daemon
        platforms: [linux, darwin]
      - cmd: cmd /c '.\gradlew.bat' {{.GRADLE_ARGS}} --no-daemon
        platforms: [windows]

  # — Lint —

  lint-go:
    desc: Vet the Go module
    dir: apps/packwand
    cmds:
      - go vet ./...

  lint-cursorapi:
    desc: Vet the cursorapi Go module
    dir: "{{.API_DIR}}"
    cmds:
      - go vet ./...

  lint-webview:
    desc: Clippy on mod-browser-webview
    dir: "{{.WEBVIEW_DIR}}"
    cmds:
      - cargo clippy --all-targets

  lint-installer:
    desc: Compile-check packwiz-installer (Gradle has no separate lint; compilation surfaces diagnostics)
    cmds:
      - task: gradlew
        vars: { GRADLE_ARGS: "classes bootstrap:classes" }

  audit-go:
    desc: Scan the Go module for known vulnerabilities
    dir: apps/packwand
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint-rust-core:
    desc: fmt + clippy on the packwand-rs launcher core (packwand-devboot and friends)
    dir: "{{.RS_DIR}}"
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings

  audit-rust:
    desc: Scan Rust lockfiles for RUSTSEC advisories (requires cargo-audit)
    cmds:
      - cargo audit --file {{.WEBVIEW_DIR}}/Cargo.lock
      - cargo audit --file {{.GUI_TAURI_DIR}}/src-tauri/Cargo.lock
      - cargo audit --file {{.RS_DIR}}/Cargo.lock

  lint-bot:
    desc: ESLint + Prettier check on the Discord bot (requires bun)
    dir: "{{.BOT_DIR}}"
    cmds:
      - bun install --frozen-lockfile
      - bun run lint

  lint-typos:
    desc: Repo-wide spell check (requires typos — cargo install typos-cli); config in _typos.toml
    cmds:
      - typos .

  lint-actions:
    desc: Lint Forgejo workflows incl. shellcheck of run blocks (requires actionlint — go install github.com/rhysd/actionlint/cmd/actionlint@latest)
    cmds:
      - actionlint -config-file .forgejo/actionlint.yaml -ignore 'in invalid format because owner and repo' .forgejo/workflows/*.yml

  lint:
    desc: All linters/vetters and vulnerability scans
    deps: [lint-go, lint-cursorapi, lint-webview, lint-installer, lint-rust-core, lint-bot, lint-typos, lint-actions, audit-go, audit-rust, docs-typecheck]

  # — Test —

  test-go:
    desc: Go tests
    dir: apps/packwand
    cmds:
      - go test ./...

  test-cursorapi:
    desc: Test the cursorapi Go module
    dir: "{{.API_DIR}}"
    cmds:
      - go test ./...

  test-installer:
    desc: Gradle tests (installer + bootstrap)
    cmds:
      - task: gradlew
        vars: { GRADLE_ARGS: "test" }

  test-webview:
    desc: Cargo tests
    dir: "{{.WEBVIEW_DIR}}"
    cmds:
      - cargo test

  test-rust-core:
    desc: Cargo tests for the packwand-rs launcher core (excludes #[ignore]'d real-boot tests needing Java/network)
    dir: "{{.RS_DIR}}"
    cmds:
      - cargo test

  test:
    desc: All tests
    deps: [test-go, test-cursorapi, test-installer, test-webview, test-rust-core]

  # — Build —

  build-packwand:
    desc: Build the packwand CLI
    dir: apps/packwand
    cmds:
      - go build -o packwand{{exeExt}} .

  build-cursorapi:
    desc: Build the cursorapi HTTP server
    dir: "{{.API_DIR}}"
    cmds:
      - go build -o cursorapi{{exeExt}} ./cursorapi

  build-installer:
    desc: Build packwiz-installer (and the legacy Java bootstrap) via Gradle
    dir: "{{.INSTALLER_DIR}}"
    cmds:
      - task: gradlew
        vars: { GRADLE_ARGS: "build -x test" }
    sources:
      - "src/**/*"
      - "bootstrap/src/**/*"
      - "build.gradle.kts"
      - "bootstrap/build.gradle"
      - "settings.gradle"
    generates:
      - "build/dist/packwiz-installer.jar"

  build-webview:
    desc: Build mod-browser-webview (release). Linux requires webkit2gtk; Windows requires the WebView2 runtime at run time.
    dir: "{{.WEBVIEW_DIR}}"
    cmds:
      - cargo build --release
    sources:
      - "src/**/*"
      - "Cargo.toml"
      - "Cargo.lock"
    generates:
      - "target/release/mod_browser_webview{{exeExt}}"

  build-bootstrap:
    desc: Build the Go packwiz-bootstrap wrapper
    dir: apps/packwand
    cmds:
      - go build -o packwiz-bootstrap{{exeExt}} ./cmd/packwiz-bootstrap

  build-gui-sidecar:
    desc: Build the packwand CLI and stage it as a Tauri external binary (sidecar), named for the host Rust target triple, so `cargo tauri build` bundles it via bundle.externalBin
    vars:
      # Avoids grep/cut: Task's embedded shell (mvdan/sh) parses this fine on
      # native Windows without either binary on PATH, unlike the previous
      # `grep '^host:' | cut -d' ' -f2` (which needs Git for Windows's
      # usr/bin on PATH — not there by default outside a Git Bash shell).
      TRIPLE:
        sh: |
          rustc -vV | while IFS= read -r line; do
            case "$line" in
              host:*) printf '%s' "${line#host: }" ;;
            esac
          done
    cmds:
      - cmd: mkdir -p {{.GUI_TAURI_DIR}}/src-tauri/binaries
      - go build -C apps/packwand -o gui/tauri/src-tauri/binaries/packwand-{{.TRIPLE}}{{exeExt}} .

  build-gui:
    desc: Build the native Packwand GUI app (Tauri v2) for the host OS. Requires cargo tauri-cli; see docs/packwand/docs/development/gui-build.md
    dir: "{{.GUI_TAURI_DIR}}"
    deps: [build-gui-sidecar]
    cmds:
      - cargo tauri build

  gen-nix:
    desc: Generate/update packwiz2nix checksums.json for every modpack subdir via packwand's internal generator
    cmds:
      - go run -C apps/packwand . nix gen --all

  gen-licenses:
    desc: Regenerate the webview third-party licenses page (embedded at build time)
    dir: "{{.WEBVIEW_DIR}}"
    cmds:
      - cargo install --locked cargo-about
      - cargo about generate about.hbs -o src/licenses.html

  build-bot:
    desc: Typecheck + bundle smoke-test the Discord bot (requires bun; Bun runs the TS sources directly in production)
    dir: "{{.BOT_DIR}}"
    cmds:
      - bun install --frozen-lockfile
      - bun run typecheck
      - bun build src/index.ts --target=bun --outdir=dist

  build:
    desc: Build everything (CLI, installer, webview, bootstrap, bot)
    deps: [build-packwand, build-cursorapi, build-installer, build-webview, build-bootstrap, build-bot]

  # — Docs —

  docs-typecheck:
    desc: Type-check the .mts/.ts scripts and VitePress configs of all three docs sites
    cmds:
      - for: { var: DOCS_SITES }
        cmd: cd {{.ITEM}} && npm ci && npm run typecheck

  docs-build:
    desc: Build all three docs sites (main, packwand, packwiz)
    cmds:
      - for: { var: DOCS_SITES }
        cmd: cd {{.ITEM}} && npm ci && npm run docs:build

  docs-lint-links:
    desc: Check cross-site links across all three docs sites against their built dist/ output (run after docs-build)
    cmds:
      - node docs/link-lint.mts

  # — Frontend —

  gui-frontend:
    desc: Rebuild the Gleam GUI frontend into gui/static
    dir: apps/packwand/gui/ui
    cmds:
      - node build.mts
